{{- if and .Values.catalogSync.enabled .Values.qdrant.host }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-catalog-sync
  labels:
    {{- include "durable-agents.labels" . | nindent 4 }}
---
# Read access to the catalog CRs, granted in the namespace where
# agent-controller keeps them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-catalog-reader
  namespace: {{ .Values.catalog.namespace }}
  labels:
    {{- include "durable-agents.labels" . | nindent 4 }}
rules:
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["tools", "skills", "agents"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-catalog-reader
  namespace: {{ .Values.catalog.namespace }}
  labels:
    {{- include "durable-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-catalog-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-catalog-sync
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-catalog-sync
  labels:
    {{- include "durable-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: catalog-sync
  template:
    metadata:
      labels:
        {{- include "durable-agents.labels" . | nindent 8 }}
        app.kubernetes.io/component: catalog-sync
    spec:
      serviceAccountName: {{ .Release.Name }}-catalog-sync
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-sync
          image: "{{ .Values.catalogSync.image.repository }}:{{ .Values.catalogSync.image.tag }}"
          imagePullPolicy: {{ .Values.catalogSync.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CATALOG_NAMESPACE
              value: {{ .Values.catalog.namespace | quote }}
            {{- include "durable-agents.qdrantEnv" . | nindent 12 }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.llm.baseURL | quote }}
            - name: OPENAI_EMBED_MODEL
              value: {{ .Values.llm.embedModel | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.secretName }}
                  key: OPENAI_API_KEY
          resources:
            {{- toYaml .Values.catalogSync.resources | nindent 12 }}
{{- end }}
