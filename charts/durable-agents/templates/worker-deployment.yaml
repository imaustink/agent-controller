apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "durable-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "durable-agents.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if .Values.toolrun.enabled }}
      serviceAccountName: {{ .Release.Name }}-worker
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "durable-agents.temporalEnv" . | nindent 12 }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.llm.baseURL | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: OPENAI_EMBED_MODEL
              value: {{ .Values.llm.embedModel | quote }}
            {{- if .Values.qdrant.host }}
            {{- include "durable-agents.qdrantEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.toolrun.enabled }}
            - name: TOOLRUN_MODE
              value: "k8s"
            - name: TOOLRUN_NAMESPACE
              value: {{ .Values.catalog.namespace | quote }}
            - name: CALLBACK_BASE_URL
              value: {{ include "durable-agents.callbackBaseURL" . | quote }}
            - name: CALLBACK_SECRET_NAME
              value: {{ .Values.callback.secretName | quote }}
            - name: CALLBACK_SECRET_KEY
              value: {{ .Values.callback.secretKey | quote }}
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.secretName }}
                  key: OPENAI_API_KEY
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
