{{- if .Values.eventSources.nightlySweep.enabled }}
{{- /*
Example: a timer source (docs/event-triggers.md §8). core-controller
materializes it as an owned CronJob (eventsource-nightly-sweep) that ticks
integration-gateway's POST /events/nightly-sweep/tick with the shared tick
token; the gateway builds the envelope with `payload` as its body, so triggers
read it exactly as they would a webhook body.
*/}}
apiVersion: {{ .Values.crdApiVersion }}
kind: EventSource
metadata:
  name: nightly-sweep
  labels:
    {{- include "tools.labels" . | nindent 4 }}
spec:
  cron:
    schedule: {{ .Values.eventSources.nightlySweep.schedule | quote }}
    {{- with .Values.eventSources.nightlySweep.timeZone }}
    timeZone: {{ . | quote }}
    {{- end }}
    {{- if .Values.eventSources.nightlySweep.suspend }}
    suspend: true
    {{- end }}
    {{- with .Values.eventSources.nightlySweep.payload }}
    payload:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
