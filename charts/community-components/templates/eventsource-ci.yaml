{{- if .Values.eventSources.ci.enabled }}
{{- /*
Example: a CI system's outbound webhook (docs/event-triggers.md §1), served at
POST /webhooks/ci. `bearer` with no header compares `Authorization: Bearer
<secret>` in constant time -- the shape most CI notifiers can send.
*/}}
apiVersion: {{ .Values.crdApiVersion }}
kind: EventSource
metadata:
  name: ci
  labels:
    {{- include "tools.labels" . | nindent 4 }}
spec:
  webhook:
    verify:
      scheme: bearer
      secretRef:
        name: {{ .Values.eventSources.ci.secretRef.name | quote }}
        key: {{ .Values.eventSources.ci.secretRef.key | quote }}
{{- end }}
