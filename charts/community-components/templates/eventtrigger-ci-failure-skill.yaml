{{- if .Values.eventTriggers.ciFailureSkill.enabled }}
{{- $t := .Values.eventTriggers.ciFailureSkill }}
{{- /*
Example: a failed CI run forces a Skill (target.skillRef -- no retrieval; a
skill the caller's roles cannot reach is a turn failure, not a fallback).
The expected body is whatever the CI notifier sends; this example assumes
  {"status": "failure", "repository": "owner/name", "branch": "...",
   "job": "...", "url": "<run url>"}
The outcome is POSTed to reply.http.url (a literal, never templated, so event
content cannot redirect it), signed with x-event-signature when secretRef is
set.
*/}}
apiVersion: {{ .Values.crdApiVersion }}
kind: EventTrigger
metadata:
  name: ci-failure-skill
  labels:
    {{- include "tools.labels" . | nindent 4 }}
spec:
  sourceRef: ci
  match:
    cel: >-
      has(body.status) && body.status in ["failure", "failed", "error"]
  params:
    repository: body.repository
    branch: 'has(body.branch) ? body.branch : "unknown"'
    job: body.job
    url: body.url
  target:
    skillRef: {{ $t.skillRef | quote }}
    readOnly: true
    promptTemplate: |
      CI job "{{`{{job}}`}}" failed on {{`{{repository}}`}} (branch {{`{{branch}}`}}).
      Run: {{`{{url}}`}}

      Find the root cause of this failure from the evidence available to you and
      report it concisely: what failed, why, and the most likely fix. Do not
      change anything.
  {{- if $t.reply.url }}
  reply:
    http:
      url: {{ $t.reply.url | quote }}
      {{- with $t.reply.secretRef }}
      secretRef:
        name: {{ .name | quote }}
        key: {{ .key | quote }}
      {{- end }}
  {{- end }}
{{- end }}
