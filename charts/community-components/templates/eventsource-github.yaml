{{- if .Values.eventSources.github.enabled }}
{{- /*
The GitHub App's webhook (docs/event-triggers.md §1). The object name IS the
route: integration-gateway serves this source at POST /webhooks/github, the
same URL the App has always been configured with.

secretRef points at the webhook secret integration-gateway already holds
(its bring-your-own Secret, key GITHUB_WEBHOOK_SECRET); the gateway now reads it
through this reference via the k8s API instead of an env var.

sender: a delivery is only ever forwarded as the turn's principal after the
GitHub provider verifies the login against team/collaborator roles on
`repositoryFrom`; bot-authored deliveries are dropped (dropBots defaults to
true), so an agent cannot label its own PR/issue to re-trigger itself.
*/}}
apiVersion: {{ .Values.crdApiVersion }}
kind: EventSource
metadata:
  name: github
  labels:
    {{- include "tools.labels" . | nindent 4 }}
spec:
  webhook:
    verify:
      scheme: hmacSha256
      header: x-hub-signature-256
      prefix: "sha256="
      secretRef:
        name: {{ .Values.eventSources.github.secretRef.name | quote }}
        key: {{ .Values.eventSources.github.secretRef.key | quote }}
    deliveryIdHeader: x-github-delivery
  sender:
    provider: github
    loginFrom: body.sender.login
    isBotFrom: body.sender.type == "Bot"
    repositoryFrom: body.repository.full_name
{{- end }}
