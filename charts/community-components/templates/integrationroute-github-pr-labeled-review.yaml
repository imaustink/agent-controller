{{- if .Values.integrationRoutes.githubPrLabeledReview.enabled }}
apiVersion: {{ .Values.crdApiVersion }}
kind: IntegrationRoute
metadata:
  name: github-pr-labeled-review
  labels:
    {{- include "tools.labels" . | nindent 4 }}
spec:
  match:
    source: github
    event: pull_request
    action: labeled
    # This route and github-pr-labeled-triage share the exact same
    # source/event/action triple -- the label is the ONLY thing distinguishing
    # "review this PR" from "triage this PR", so both must pin match.labelName
    # or the two are indistinguishable and one silently swallows the other.
    # Must equal integration-gateway's config.githubReviewLabel (the gateway
    # ignores a pull_request.labeled event for any other label).
    labelName: {{ .Values.integrationRoutes.githubPrLabeledReview.labelName | default "ai-review" | quote }}
  # No Tool wrapper needed -- dispatches straight to the Agent CR (ADR 0021),
  # same pattern as integrationroute-github-issue-labeled-triage.yaml. Which
  # SWE Agent CR reviews the PR is value-driven (default opencode-swe-agent)
  # so an environment can point it at claude-code-swe-agent instead without
  # editing this template -- whichever it names must have enabled=true in the
  # same values file, or this route dispatches to a non-existent Agent.
  #
  # Triggered when integration-gateway relays a pull_request.labeled event
  # whose label matches its configured review label (integration-gateway's
  # config.githubReviewLabel, e.g. "ai-review"). A human applies that label:
  # the gateway drops bot-authored events, so the agent that opened the PR
  # cannot self-trigger a review of its own pull request.
  agentRef: {{ .Values.integrationRoutes.githubPrLabeledReview.agentRef | default "opencode-swe-agent" }}
  # When the review requests changes, the agent also opens a follow-up ticket
  # (a GitHub issue in the same {{`{{owner}}`}}/{{`{{repo}}`}}) capturing the
  # findings and an AI-agent fix prompt. fixLabelName is the label a maintainer
  # applies to that ticket to dispatch the fix -- it must equal the trigger
  # label the triage routes react to (github-pr-labeled-triage /
  # github-issue-labeled-triage, integration-gateway's config.githubTriggerLabel,
  # e.g. "ai-triage"), or the ticket will tell maintainers to apply a label
  # nothing is listening for. Opening the ticket does not self-trigger anything:
  # the gateway acts only on the trigger label being applied, and drops
  # bot-authored events regardless.
  promptTemplate: |
    Pull request {{`{{owner}}`}}/{{`{{repo}}`}}#{{`{{prNumber}}`}} was labeled "{{`{{labelName}}`}}": "{{`{{title}}`}}"

    {{`{{body}}`}}

    Review this pull request. Check out the branch, examine the diff, and
    assess correctness, test coverage, security, and any risks. Post your
    review on the PR (e.g. `gh pr review {{`{{prNumber}}`}}` with inline
    comments where a specific file/line is at issue), being concrete and
    citing file:line. Do not merge or push changes -- only review.

    If -- and only if -- your review leaves comments requesting a change
    (anything beyond a clean approval), open one follow-up tracking ticket so
    the fix is not lost. Run `gh issue create` in
    {{`{{owner}}`}}/{{`{{repo}}`}} (the same repository the PR targets, not a
    new one) with a title that names the problem and a body that:
      1. Summarizes every issue you raised, citing file:line and linking back
         to PR #{{`{{prNumber}}`}} so the ticket and the review stay connected.
      2. Ends with a ready-to-run fix prompt for an AI coding agent, fenced in
         a ```text code block. Write it as a direct instruction (goal,
         affected files, and concrete acceptance criteria) that another agent
         could act on without re-reading the diff -- e.g. "In
         {{`{{owner}}`}}/{{`{{repo}}`}}, fix <problem> in <file:line> so that
         <criteria>; add a regression test; do not change unrelated behavior."
    In the ticket body and in your PR review, note that applying the
    "{{ .Values.integrationRoutes.githubPrLabeledReview.fixLabelName | default "ai-triage" }}"
    label to that ticket will dispatch an AI agent to implement the fix. Open
    exactly one ticket covering all findings -- not one per comment -- and do
    not open any ticket when your review is an approval with nothing to fix.

    You get exactly one turn to do this -- you cannot pause partway through
    and wait for a CI check, build, or test run to finish, and nothing will
    re-invoke you automatically when one does. Post a complete review now
    based on the diff and code alone. If a check is still running, mention
    its current status as one line in the review (e.g. "CI is still running
    as of this review") -- do not let it block or delay posting the rest of
    your assessment, and do not say you'll "finalize" or "resume" later.
{{- end }}
