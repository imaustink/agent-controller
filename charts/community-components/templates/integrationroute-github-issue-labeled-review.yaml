{{- if .Values.integrationRoutes.githubIssueLabeledReview.enabled }}
apiVersion: {{ .Values.crdApiVersion }}
kind: IntegrationRoute
metadata:
  name: github-issue-labeled-review
  labels:
    {{- include "tools.labels" . | nindent 4 }}
spec:
  match:
    source: github
    event: issues
    action: labeled
    # This route and github-issue-labeled-triage share the exact same
    # source/event/action triple -- the label is the ONLY thing distinguishing
    # "review this issue" from "triage this issue". This route pins
    # match.labelName so it wins for the review label; triage deliberately
    # leaves labelName unset (a wildcard) and still catches every other
    # issues.labeled event, because the registry's specificity scoring ranks a
    # route naming BOTH action and labelName above one naming only action (see
    # crd-integration-route-registry.ts `match`).
    # Must equal integration-gateway's config.githubReviewLabel (the gateway
    # ignores an issues.labeled event for any other label).
    labelName: {{ .Values.integrationRoutes.githubIssueLabeledReview.labelName | default "ai-review" | quote }}
  # No Tool wrapper needed -- dispatches straight to the Agent CR (ADR 0021),
  # same pattern as integrationroute-github-pr-labeled-review.yaml. Which SWE
  # Agent CR reviews the issue is value-driven (default opencode-swe-agent) so
  # an environment can point it at claude-code-swe-agent instead without
  # editing this template -- whichever it names must have enabled=true in the
  # same values file, or this route dispatches to a non-existent Agent.
  #
  # Triggered when integration-gateway relays an issues.labeled event whose
  # label matches its configured review label (integration-gateway's
  # config.githubReviewLabel, e.g. "ai-review"). A human applies that label:
  # the gateway drops bot-authored events, so the agent that filed an issue
  # cannot self-trigger a review of it. The gateway removes the label when the
  # run ends, so re-applying it re-triggers the review.
  agentRef: {{ .Values.integrationRoutes.githubIssueLabeledReview.agentRef | default "opencode-swe-agent" }}
  # The SWE-ENFORCED-MODE sentinel on the first line is CODE-ENFORCED by the SWE
  # agent container, not just advice to the model: on an exact match the agent
  # adds `git push`/`gh pr create`/`gh pr merge`/... to its permission deny list
  # and mints a read-only (contents:read) GitHub token, so a push/merge fails at
  # the CLI and credential layers (see apps/claude-code-swe-agent/src/claude.ts
  # REVIEW_MODE_MARKER and apps/opencode-swe-agent/src/opencode.ts). The
  # IntegrationRoute carries no env/mode field, so the rendered promptTemplate is
  # the only per-route channel into the container; keep this string byte-for-byte
  # identical to REVIEW_MODE_MARKER in both agents. It sits in the fixed, trusted
  # part of the template above the body so event content cannot strip it.
  promptTemplate: |
    SWE-ENFORCED-MODE: review-only
    GitHub issue {{`{{owner}}`}}/{{`{{repo}}`}}#{{`{{issueNumber}}`}} was labeled "{{`{{labelName}}`}}": "{{`{{title}}`}}"

    {{`{{body}}`}}

    Review this issue. Read the issue and any pull request or code it
    references, then give a concrete, actionable review of the proposal:
    assess whether it is clear and complete, whether the approach is sound,
    what risks or edge cases it misses, and what a maintainer should decide
    before work starts. Post your review as a comment on the issue, being
    specific and citing file:line where the discussion is about existing code.
    Do not implement the change, open a pull request, or push any commits --
    only review.

    Keep it concise -- its value is in the signal, not the volume. Lead with
    the verdict, then the few points that materially change the decision. Skip
    nitpicks, praise, and restating the issue back to its author. A short,
    high-signal review beats an exhaustive one.

    You get exactly one turn to do this -- you cannot pause partway through
    and wait for a CI check, build, or test run to finish, and nothing will
    re-invoke you automatically when one does. Post a complete review now
    based on the issue and code alone. If something you would want is still
    running, mention its current status as one line in the review -- do not
    let it block or delay posting the rest of your assessment, and do not say
    you'll "finalize" or "resume" later.
{{- end }}
