{{- if .Values.eventTriggers.genericHmacTool.enabled }}
{{- $t := .Values.eventTriggers.genericHmacTool }}
{{- /*
Example: a signed webhook runs one Tool directly (target.toolRef -- the
FAAS/direct-invoke path; no planner, no prompt). Tools take one string input:
a single param named `input` is passed as that string (docs/event-triggers.md
§1), which is exactly what web-fetch expects -- a bare URL. Send
  {"url": "https://example.com/page"}
signed with x-signature-256. The tool's result is POSTed to reply.http.url.
*/}}
apiVersion: {{ .Values.crdApiVersion }}
kind: EventTrigger
metadata:
  name: generic-hmac-tool
  labels:
    {{- include "tools.labels" . | nindent 4 }}
spec:
  sourceRef: generic-hmac
  match:
    cel: >-
      has(body.url) && body.url.startsWith("https://")
  params:
    input: body.url
  target:
    toolRef: {{ $t.toolRef | quote }}
    readOnly: true
  {{- if $t.reply.url }}
  reply:
    http:
      url: {{ $t.reply.url | quote }}
      {{- with $t.reply.secretRef }}
      secretRef:
        name: {{ .name | quote }}
        key: {{ .key | quote }}
      {{- end }}
  {{- end }}
{{- end }}
