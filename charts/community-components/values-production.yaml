# values-production.yaml — Tool/Skill/Agent catalog on the homelab cluster
# (namespace controller-agent). Consumed automatically by
# .github/workflows/deploy.yml on every push to main; formerly lived as
# values-community-components.yaml in the private imaustink/homelab repo and
# was fetched cross-repo via a GitHub App token on every deploy -- moved here
# to drop that indirection now that nothing in this file is a real secret.
#
# First-time manual install AFTER agent-controller (its CRs need the CRDs
# that chart installs):
#
#   helm install community-components charts/community-components -n controller-agent \
#     -f charts/community-components/values-production.yaml

enabled: true

crdApiVersion: core.controller-agent.dev/v1alpha1

# Chart now templates recipe-scraper/recipe-publisher/opencode-swe-agent/
# web-search's ServiceAccounts itself (serviceAccount.create default true per
# component) — this is what actually attaches the private-registry pull
# secret to them.
imagePullSecrets:
  - name: docker-registry-credentials

recipeScraper:
  enabled: true
  image: registry.kurpuis.com:5000/recipe-scraper:latest
  serviceAccountName: recipe-scraper
  openai:
    secretName: agent-orchestrator-secrets
    secretKey: OPENAI_API_KEY

# web-search: queries the in-cluster SearXNG instance (agent-controller
# chart's searxng.enabled=true — values-production.yaml). Default
# searxngBaseUrl already matches that release's name ("agent-controller").
webSearch:
  enabled: true
  image: registry.kurpuis.com:5000/web-search:latest
  serviceAccountName: web-search

# web-fetch: fetches a single URL and returns its main readable content as
# Markdown. Required alongside webSearch above — the web-search skill's
# toolRefs lists both tools, and its derived audience (ADR 0011) is empty
# without this one. No external dependency (SSRF-guarded).
webFetch:
  enabled: true
  image: registry.kurpuis.com:5000/web-fetch:latest
  serviceAccountName: web-fetch

# kubectl-readonly: cluster debugging tool. Grants its ServiceAccount a
# cluster-wide read-only ClusterRole (see
# charts/community-components/templates/clusterrole-kubectl-readonly.yaml),
# including get/list/watch on Secrets -- the tool's own code (not RBAC) is
# what keeps values out of its output. See tools/kubectl-readonly/README.md
# before flipping this off elsewhere if that trade-off isn't acceptable.
kubectlReadonly:
  enabled: true
  image: registry.kurpuis.com:5000/kubectl-readonly:latest
  serviceAccountName: kubectl-readonly

recipePublisher:
  enabled: true
  image: registry.kurpuis.com:5000/recipe-publisher:latest
  serviceAccountName: recipe-publisher
  mealieBaseUrl: "https://recipes.kurpuis.com"
  ingredientParser: "nlp"
  # Create first:
  #   kubectl create secret generic recipe-publisher-secrets -n controller-agent \
  #     --from-literal=MEALIE_API_TOKEN=<token>
  secretName: recipe-publisher-secrets
  secretKey: MEALIE_API_TOKEN

# opencode-swe-agent: privileged GitHub coding sub-agent. DISABLED in prod --
# the Claude Code engine (claudeCodeSweAgent below) is now the SWE agent for
# every path: the auto-triage IntegrationRoute and the self-improvement skill
# both point their agentRef at claude-code-swe-agent (see integrationRoutes
# and skills below). Re-enable only if reverting those back to opencode.
#
# History: cut over from PAT-only (Phase A) to per-user GitHub identity
# linking (docs/adr/0022, Phase B) -- the opencode-swe-secrets GITHUB_TOKEN
# key is retired as part of that cutover; ANTHROPIC_API_KEY remains PAT-based.
opencodeSweAgent:
  enabled: false
  image: registry.kurpuis.com:5000/opencode-swe-agent:latest
  serviceAccountName: opencode-swe-agent
  secretName: opencode-swe-secrets
  secretKey: GITHUB_TOKEN
  anthropicSecretKey: ANTHROPIC_API_KEY
  # Dual-token pattern (docs/adr/0022 update): the same GitHub App used by
  # integration-gateway for identity-link now also backs installation-token
  # writes here. Copied (not cross-referenced) into opencode-swe-secrets
  # from integration-gateway-secrets so this chart doesn't depend on that
  # one's secret name.
  githubAppIdSecretKey: GITHUB_APP_ID
  githubAppPrivateKeySecretKey: GITHUB_APP_PRIVATE_KEY
  githubAppInstallationIdSecretKey: GITHUB_APP_INSTALLATION_ID
  githubAppSlug: k5s-bot
  # Per-user GitHub identity linking (docs/adr/0022) -- agent-orchestrator/
  # integration-gateway's identityLink.enabled are already on (see
  # charts/agent-controller/values-production.yaml). Flipping this breaks
  # every opencode-swe-agent request for every caller until they complete
  # the device-flow link. Now that the App creds above are also set, this
  # unlocks the dual-token pattern rather than pure per-user-token writes.
  identityLink:
    enabled: true
    providers:
      - github

# claude-code-swe-agent: requires claude-code-swe-secrets to exist (see
# values.yaml's comment block for this key for the exact `kubectl create
# secret` invocation) -- CI builds/pushes the image, but Helm can't source
# secret VALUES on its own, so that Secret is still a manual prerequisite.
#
# identityLink.providers lists only the credentials a RUN actually needs.
#
# `github` is deliberately NOT here. It was added so the gate could derive the
# canonical `github:<login>` credential subject (ADR 0029), but declaring a
# provider does two unrelated things: it obtains an identity mapping AND it
# provisions a credential. Only the first was wanted. The second populated
# GITHUB_TOKEN, which switched on this agent's delegated-write path and
# produced a production 401 from a `/user` call the agent had no reason to
# make.
#
# ADR 0030 separates those concerns: the orchestrator now resolves the caller's
# login with a read-only lookup of their existing github link (or the webhook's
# verified sender) regardless of what this list says, and injects it as
# AGENT_ACTOR_LOGIN. So cross-flow credential sharing still works, and this
# agent no longer needs a per-user GitHub credential it never used -- git
# operations continue to run on the App installation token, as they always did.
#
# Removing it also drops the extra trigger a user needed (the first webhook
# turn used to spend itself posting a GitHub link prompt) and decouples Claude
# authorization from GitHub OAuth availability.
claudeCodeSweAgent:
  enabled: true
  image: registry.kurpuis.com:5000/claude-code-swe-agent:latest
  serviceAccountName: claude-code-swe-agent
  secretName: claude-code-swe-secrets
  secretKey: GITHUB_TOKEN
  anthropicSecretKey: ""
  claudeCodeOAuthTokenSecretKey: ""
  githubAppIdSecretKey: GITHUB_APP_ID
  githubAppPrivateKeySecretKey: GITHUB_APP_PRIVATE_KEY
  githubAppInstallationIdSecretKey: GITHUB_APP_INSTALLATION_ID
  githubAppSlug: k5s-bot
  model: ""
  identityLink:
    enabled: true
    providers:
      - claude
      # Required for Remote Control (see remoteControl below) -- without
      # this, agent-orchestrator never resolves/injects the per-run
      # CLAUDE_LOGIN_CREDENTIALS_JSON secret the seed-claude-credentials
      # init container reads, and remoteControl.enabled alone does nothing.
      - claude-remote
  # Claude Code Remote Control (claude.ai/code session takeover) for
  # ai-triage runs, replacing the old session-page link in the triage
  # comment. Also requires: (1) the cluster's Agent CRD to actually have the
  # initContainers field -- once a manual `kubectl apply` of that CRD, now done
  # by the deploy job's "Apply CRDs" step on every push
  # (.github/workflows/release.yml), since `helm upgrade` never updates CRDs on
  # an existing release. (2) integration-gateway's claudeAuth.enabled=true (see
  # charts/agent-controller/values-production.yaml) so its `mode=login` PTY
  # flow is actually wired up, not just the setup-token one.
  #
  # Re-enabled 2026-07-24: a real triage run under this DID complete and
  # reopened an existing PR, so the completion-detection path isn't as
  # broken as the earlier debug-pod probe suggested -- likely just slow
  # (claude-runner.ts's polling interval) rather than genuinely stuck.
  # Iterating on the exact polling behavior locally (a real container, not
  # the live cluster) rather than disabling this again.
  remoteControl:
    enabled: true

# github: single allowlisted gh CLI command tool (issue/pr/repo/release/
# search/workflow/run), authenticated as the calling user's own linked
# GitHub identity (ADR 0022/0032) -- reuses the exact same identity-link
# plumbing already enabled for opencodeSweAgent above (agent-orchestrator's
# and integration-gateway's identityLink.enabled, see
# charts/agent-controller/values-production.yaml), no new gateway/App
# configuration needed. Lighter-weight than delegating to opencode-swe-agent
# for a quick, targeted GitHub read/write that doesn't need a clone or code
# change.
githubTool:
  enabled: true
  image: registry.kurpuis.com:5000/github:latest
  serviceAccountName: github-tool
  identityLink:
    enabled: true
    providers:
      - github

# ssh: command execution over SSH, resolved via a copy of the operator's own
# ~/.ssh/config Host aliases (home/bastion/console, printcam/airvinyl/
# airbuddy -- deliberately excludes the Verizon/client boxes and "parents"
# also in that file). kube0-8 and db1-3 were deliberately dropped even
# though they're read-only-safe candidates: allowedCommands: "*" below
# means this tool can now WRITE on anything it reaches, and those are the
# actual cluster/database nodes this repo runs on -- too much blast radius
# for "*" for now. Re-add them (and their allowedHosts entries) once a
# dedicated, less-privileged key backs this tool instead of the operator's
# own id_rsa, or if allowedCommands is narrowed back down from "*".
#
# allowedCommands is "*" -- WIDE OPEN, no command allowlist at all beyond
# the remote-shell-injection charset check (tools/ssh/src/allowlist.ts).
# This deliberately trades the tool's default read-only-diagnostics posture
# for read/write capability (restart services, edit/delete files, ...) on
# every host below, per explicit operator request: accepted as tolerable
# risk against homelab boxes the operator doesn't mind breaking for now.
# Don't copy "*" into a values file for infrastructure that matters more --
# use a custom comma-separated command list instead. The only remaining
# boundaries here are allowedHosts below and whatever the operator's own
# id_rsa can already do on each target.
#
# allowedHosts is set below, DERIVED from the sshConfig block's own Host
# list -- it is NOT a redundant second allowlist. resolveTarget
# (tools/ssh/src/target.ts) falls back to any literal "user@host" when a
# caller's target string doesn't match an sshConfig alias, so with
# allowedHosts empty sshConfig's Host list restricts nothing at all: a
# caller could dial "root@192.168.1.71" directly (a different user than the
# admin this file maps console to) or any other host reachable with this key.
# Populating allowedHosts with exactly the resolved user@host:port pairs
# below is what actually turns "the aliases we curated" into "the only
# targets this tool can reach."
#
# TEMPORARY CREDENTIAL: this tool's SSH_PRIVATE_KEY is currently the
# operator's own personal id_rsa (full interactive/admin access to every
# host below), not a dedicated scoped key -- see tools/ssh/README.md's
# "Choosing a credential" section for why that's a real blast-radius
# tradeoff. Rotate to a dedicated keypair + restricted authorized_keys entry
# per tools/ssh/README.md, then update SSH_PRIVATE_KEY in the Secret below
# and delete this note. No new public key needs installing on the targets
# below in the meantime -- id_rsa is already authorized on all of them for
# the operator's own interactive access.
#
# console's IP changed from 192.168.1.83 to 192.168.1.71 (DHCP lease churn --
# same box, confirmed by keyscanning both the ed25519, rsa, and ecdsa host
# keys at the new address and matching them against the ones already on file
# for it under its console.local mDNS name). Its host key is now included in
# the keyscan below.
#
# Prerequisite:
#   kubectl create secret generic ssh-tool-secrets -n controller-agent \
#     --from-file=SSH_PRIVATE_KEY=~/.ssh/id_rsa \
#     --from-literal=SSH_KNOWN_HOSTS="$(ssh-keyscan -t ed25519 \
#       166.113.38.187 192.168.1.43 192.168.1.71 \
#       192.168.1.235 airvinyl.local 192.168.1.218)"
sshTool:
  enabled: true
  image: registry.kurpuis.com:5000/ssh:latest
  serviceAccountName: ssh-tool
  allowedHosts: "austinkurpuis@166.113.38.187,austinkurpuis@192.168.1.43,admin@192.168.1.71,pi@192.168.1.235,pi@airvinyl.local,pi@192.168.1.218"
  allowedCommands: "*"
  sshConfig: |
    Host home
      HostName 166.113.38.187
      User austinkurpuis
    Host bastion
      HostName 192.168.1.43
      User austinkurpuis
    Host console
      HostName 192.168.1.71
      User admin
    Host printcam
      HostName 192.168.1.235
      User pi
    Host airvinyl
      HostName airvinyl.local
      User pi
    Host airbuddy
      HostName 192.168.1.218
      User pi
  secretName: ssh-tool-secrets
  privateKeySecretKey: SSH_PRIVATE_KEY
  knownHostsSecretKey: SSH_KNOWN_HOSTS

skills:
  recipeRefining:
    enabled: true
  # self-improvement: drafts a new Skill/Tool CR from a successful ad-hoc
  # turn and opens a PR, via claude-code-swe-agent (ADR 0021 -- Skill
  # delegates straight to the Agent CR, no Tool wrapper needed). Moved off
  # opencode-swe-agent (now disabled above) onto the Claude Code engine.
  selfImprovement:
    enabled: true
    agentRef: claude-code-swe-agent
  # Requires webSearch.enabled=true above.
  webSearch:
    enabled: true

integrationRoutes:
  # github-issue-labeled-triage (ADR 0024): applying integration-gateway's
  # configured trigger label (charts/agent-controller/values-production.yaml's
  # integrationGateway.config.githubTriggerLabel, "ai-triage") to a GitHub
  # issue dispatches deterministically to the agentRef below, bypassing RAG
  # skill retrieval. A label, not an assignee -- GitHub App bot users
  # generally cannot be set as issue assignees, so `issues.assigned` (this
  # route's original trigger) never fired in practice.
  #
  # agentRef is claude-code-swe-agent: triage now runs on the Claude Code
  # engine (claudeCodeSweAgent.enabled=true above), replacing the disabled
  # opencode-swe-agent. Because that agent's identityLink.providers is
  # ["claude"], the issue's sender must have a linked Claude token for a
  # triage run to launch -- the same per-user gate the whole ai-triage path
  # already uses (agent-controller values' claudeAuth.enabled).
  #
  # Requires claudeCodeSweAgent.enabled=true (set above) and the
  # IntegrationRoute CRD to exist on the cluster. `helm upgrade` does NOT
  # install/update CRDs for an existing release
  # (charts/agent-controller/charts/core-controller/crds/README.md), which is
  # why this once needed a manual `kubectl apply`; the deploy job now applies
  # every CRD on every push (.github/workflows/release.yml, "Apply CRDs").
  githubIssueLabeledTriage:
    enabled: true
    agentRef: claude-code-swe-agent
  # github-issue-labeled-review: applying integration-gateway's configured
  # review label (charts/agent-controller/values-production.yaml's
  # integrationGateway.config.githubReviewLabel, "ai-review") to an ISSUE
  # instead of a PR dispatches here: review the proposal/spec in the issue,
  # changing nothing. Sibling to githubPrLabeledReview below. Distinguished
  # from githubIssueLabeledTriage above -- same issues/labeled event -- purely
  # by match.labelName (the label-pinned route wins the registry's specificity
  # scoring over the wildcard triage route). The gateway removes the label when
  # the run ends, so re-applying it re-triggers.
  #
  # agentRef is claude-code-swe-agent (same engine as triage/review above).
  # Because that agent's identityLink.providers is ["claude"], the person who
  # applied the label must have a linked Claude token for the review to launch.
  #
  # Requires the IntegrationRoute CRD on the cluster to carry match.labelName
  # (the deploy job's "Apply CRDs" step guarantees the field exists -- `helm
  # upgrade` never updates an existing release's CRDs).
  githubIssueLabeledReview:
    enabled: true
    agentRef: claude-code-swe-agent
    labelName: ai-review
  # github-pr-labeled-review: applying integration-gateway's configured review
  # label (charts/agent-controller/values-production.yaml's
  # integrationGateway.config.githubReviewLabel, "ai-review") to a PR
  # dispatches deterministically to the agentRef below, bypassing RAG skill
  # retrieval. A human applies the label -- the gateway drops bot-authored
  # events, so the agent that opened the PR can't review its own work; a
  # maintainer requests the review by labeling the PR.
  #
  # agentRef is claude-code-swe-agent (same engine as triage above). Because
  # that agent's identityLink.providers is ["claude"], the person who applied
  # the label must have a linked Claude token for the review to launch -- the
  # same per-user gate the ai-triage path already uses.
  #
  # Requires claudeCodeSweAgent.enabled=true (set above) and the
  # IntegrationRoute CRD to exist on the cluster -- applied by the deploy job's
  # "Apply CRDs" step, since `helm upgrade` does NOT install/update CRDs for an
  # existing release.
  githubPrLabeledReview:
    enabled: true
    agentRef: claude-code-swe-agent
    labelName: ai-review
  # github-pr-labeled-triage: applying the SAME trigger label as issue triage
  # (charts/agent-controller/values-production.yaml's
  # integrationGateway.config.githubTriggerLabel, "ai-triage") to a PR instead
  # of an issue dispatches here: address the review feedback/comments on that
  # PR, push the updates to its branch, and sync it with its base branch.
  # Distinguished from githubPrLabeledReview above -- same
  # pull_request/labeled event -- purely by match.labelName.
  #
  # agentRef is claude-code-swe-agent (same engine as issue triage and
  # review). Because that agent's identityLink.providers is ["claude"], the
  # person who applied the label must have a linked Claude token for the run
  # to launch -- the same per-user gate the whole ai-triage path already uses.
  #
  # Requires the IntegrationRoute CRD on the cluster to carry match.labelName
  # (added alongside this route). This is exactly the case `helm upgrade` cannot
  # handle -- it never updates an existing release's CRDs, so the route would
  # apply cleanly while the API server pruned match.labelName out of it. The
  # deploy job's "Apply CRDs" step is what makes the field actually exist.
  githubPrLabeledTriage:
    enabled: true
    agentRef: claude-code-swe-agent
    labelName: ai-triage
