{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "integration-gateway.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "integration-gateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
Mounted whenever the credential stores are in play: they are the only thing here
that talks to the Kubernetes API (docs/adr/0034), so the token follows the
feature rather than needing to be remembered separately. `serviceAccount.automount`
can still force it on for anything else.
*/}}
automountServiceAccountToken: {{ or .Values.serviceAccount.automount .Values.identityLink.enabled }}
{{- end }}
