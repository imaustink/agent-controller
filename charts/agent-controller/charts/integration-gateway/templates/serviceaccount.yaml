{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "integration-gateway.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "integration-gateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
Always mounted: the gateway reads its EventSources (docs/adr/0048) and the
Secrets they reference from the Kubernetes API on every deployment, and the
credential stores (docs/adr/0034) use it too when identityLink is enabled.
*/}}
automountServiceAccountToken: true
{{- end }}
