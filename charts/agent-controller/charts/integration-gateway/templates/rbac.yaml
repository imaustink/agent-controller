{{- if and .Values.rbac.create .Values.identityLink.enabled }}
{{/*
Namespace-scoped Role (never a ClusterRole, ADR 0005) granting exactly what the
credential stores need (docs/adr/0034): CRUD on Secrets in this release's own
namespace, and nothing else.

Why this Role exists at all: linked credentials -- GitHub identity links, Claude
Code credentials, and the per-run write-back grants -- used to live in Redis. That
Redis runs with `--save "" --appendonly no` on an emptyDir, so when its pod
restarted it took every credential in the cluster with it and users who had
linked months earlier were asked to link again. Durability of a credential is the
platform's job, so they are Secrets now, and this is the access that requires.

Rendered only when `identityLink.enabled` -- the same condition that constructs
the stores. A deployment that only relays issue comments still needs no
Kubernetes access whatsoever, and does not get any.

`secrets: *` in one namespace is a real grant and worth being explicit about: it
is not narrowed to specific names because the object names are content-derived
(`sha256(subject)`, see secret-record-store.ts) and cannot be enumerated in
advance. It is bounded instead by namespace, and mitigated by the credentials
themselves being AES-256-GCM encrypted under a key this Role grants no access to
-- reading the namespace yields ciphertext, not tokens.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "integration-gateway.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "integration-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # `watch` is what lets a pending link resume the moment the user finishes in
    # their browser instead of on the next poll; `list` is required alongside it
    # by the API server for a watch request, and is now also used directly --
    # once per sweep interval, label-selector scoped -- by the background
    # credential refresh (claude-auth/credential-refresher.ts), which has no
    # subject to compute a Secret name from and so cannot use `get`.
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "integration-gateway.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "integration-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "integration-gateway.fullname" . }}-credentials
subjects:
  - kind: ServiceAccount
    name: {{ include "integration-gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.create }}
---
{{/*
Generic event ingestion (docs/adr/0048): the gateway watches EventSources in
its own namespace to know which /webhooks/<name> and /events/<name>/tick routes
exist and how to verify each, and `get`s the Secret each one's
webhook.verify.secretRef names. Read-only and namespace-scoped. `secrets: get`
cannot be narrowed by name -- EventSources are operator-authored and may name
any Secret -- so it is bounded by namespace, like the credential Role above.
EventTriggers are deliberately NOT granted: matching happens in the
orchestrator, never here.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "integration-gateway.fullname" . }}-event-sources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "integration-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [{{ .Values.events.crdGroup | quote }}]
    resources: ["eventsources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "integration-gateway.fullname" . }}-event-sources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "integration-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "integration-gateway.fullname" . }}-event-sources
subjects:
  - kind: ServiceAccount
    name: {{ include "integration-gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{/*
Cron ticks (docs/event-triggers.md §8): each cron EventSource's CronJob runs
as its own ServiceAccount (eventsource-<name>) and presents a projected token
minted for this gateway's audience. The gateway asks the API server whose
token it is (TokenReview) and accepts a tick for source X only from X's
ServiceAccount -- no shared secret to generate, store or rotate.

The one ClusterRole this chart gives the gateway, because TokenReview is
cluster-scoped and cannot be granted by a Role. It is exactly `create` on
tokenreviews: it answers whether a token the gateway was HANDED is valid and
whose it is, and grants access to no object. Not system:auth-delegator, which
adds subjectaccessreviews the gateway has no use for. Namespace-prefixed, as a
cluster-scoped name must not collide between releases.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "integration-gateway.fullname" . }}-tokenreview
  labels:
    {{- include "integration-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "integration-gateway.fullname" . }}-tokenreview
  labels:
    {{- include "integration-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "integration-gateway.fullname" . }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "integration-gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
