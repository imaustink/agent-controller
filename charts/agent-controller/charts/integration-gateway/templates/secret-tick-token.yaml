{{- if .Values.events.tickToken.create }}
{{- /*
The bearer token cron EventSource ticks present to POST /events/<name>/tick
(docs/event-triggers.md §7-8). core-controller's CronJobs read it from this
Secret's `token` key; the gateway reads the same key as EVENT_TICK_TOKEN.

Random on first install and PRESERVED on every upgrade via `lookup`: rotating
it under a running gateway would 401 every tick until the pod restarted.
`lookup` returns nothing under `helm template` / Argo CD, so those renders
always show a fresh value -- set events.tickToken.create=false and provision
the Secret yourself there.
*/}}
{{- $name := .Values.events.tickToken.secretName }}
{{- $token := randAlphaNum 48 | b64enc }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- with index $existing.data "token" }}
{{- $token = . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "integration-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | quote }}
{{- end }}
