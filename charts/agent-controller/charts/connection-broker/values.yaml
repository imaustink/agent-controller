replicaCount: 1

image:
  repository: ghcr.io/imaustink/agent-controller/connection-broker
  # CI publishes this image to GHCR as `:latest` and `:<sha>` only — never as the
  # chart appVersion — so an empty tag (which resolves to appVersion) would
  # ImagePullBackOff. The other images get `:latest` from values-production.yaml;
  # the broker has no production override, so it carries the default here. A
  # controlled release should pin this to the published `:<sha>` instead.
  # skaffold overrides repository+tag at build time for local/e2e, so this does
  # not affect those paths.
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # This app DOES talk to the k8s API: it watches Connection CRs and reads the
  # Secrets they name, so the token is mounted and rbac.yaml grants exactly
  # those two things.
  create: true
  annotations: {}
  name: ""
  automount: true

rbac:
  # Namespace-scoped, and deliberately narrow. The broker can read Connections
  # and the Secrets those Connections reference — it never writes either, and
  # never sees any other kind of object. It is the process holding every
  # client's third-party credentials, so its cluster reach is the thing most
  # worth keeping small.
  create: true

service:
  type: ClusterIP
  port: 8080

# The credential the orchestrator presents to probe on a user's behalf. It can
# NEVER cause a connection's service credential to be spent (docs/adr/0038 §3).
orchestratorTokenSecret:
  name: connection-broker-auth
  key: orchestratorToken

# Per-connection sync tokens, exposed as SYNC_TOKEN_<CONNECTION>. One token per
# connection rather than one for all of them, so a leaked sync credential
# reaches one client's source instead of every client's.
syncTokenSecret:
  name: connection-broker-sync-tokens

# Indexing. With either of these unset the broker serves the API only and does
# not index — a real arrangement (another process may own ingestion), which is
# why it starts rather than exits.
qdrant:
  url: ""
  apiKeySecret:
    name: ""
    key: apiKey

# Where each provider's API lives, when it is not the vendor's public cloud.
#
# Empty means the driver's own default, which is what a Cloud tenant wants. A
# Confluence Data Center or Server install serves the REST API from the site
# itself with no `api.atlassian.com` in front, and a deployment pointed at one
# has to be able to say so.
#
# Process-wide rather than per-Connection: an installation talks to one
# Atlassian or another, not to both, and a per-Connection field would invite
# pointing two Corpora at two different Atlassians while sharing a credential.
#
# The e2e environment sets `atlassian` to its in-cluster stand-in, the same way
# fake-github is reached through `githubApiUrl`.
apiOrigins:
  atlassian: ""
  slack: ""
  gdrive: ""

embeddings:
  # Must match whatever the engines embed with: a knowledge base merges scores
  # from several collections as if directly comparable, which holds only when
  # every collection was built by the same model.
  model: text-embedding-3-small
  apiKeySecret:
    name: ""
    key: apiKey

# Sized for PDF extraction, which is the only thing here that touches real
# memory. A bounded 25MB PDF plus pdf.js's working set peaks well above the
# steady state of a service that otherwise just proxies HTTP, and the parser
# itself costs about 9MB one-off on first use. 512Mi left little margin for a
# large file arriving during a sync.
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 768Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
