apiVersion: v2
name: connection-broker
description: >-
  Helm chart for the connection-broker (see apps/connection-broker): holds the
  credentials for the external systems a Connection CR names, runs the provider
  drivers, serves incremental listing and fetch to the sync worker, and answers
  per-user authorization probes for retrieval (docs/adr/0038, docs/adr/0040).
  Deliberately a separate Deployment from agent-orchestrator so third-party
  credentials and outbound egress stay out of the pod holding cluster RBAC.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/imaustink/agent-controller
sources:
  - https://github.com/imaustink/agent-controller
keywords:
  - agent
  - connections
  - knowledge-base
  - retrieval
maintainers:
  - name: controller-agent
