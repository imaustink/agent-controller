{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "connection-broker.serviceAccountName" . }}
  labels: {{- include "connection-broker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "connection-broker.fullname" . }}
  # The KB namespace, which may differ from the release namespace. The broker
  # only ever reads CRs and Secrets here, so its reach stays one namespace wide
  # — not cluster-wide — even when that namespace is not its own.
  namespace: {{ include "connection-broker.knowledgeBaseNamespace" . }}
  labels: {{- include "connection-broker.labels" . | nindent 4 }}
rules:
  # Watching these is what makes a CR created after startup take effect without
  # a restart (docs/adr/0020).
  #
  # BOTH kinds, since the split: the broker resolves a Corpus's scope against
  # the Connection that holds its credential (ADR 0043), and it loads
  # Connections first so a Corpus never binds to one it has not seen. Missing
  # `corpora` here does not degrade anything — the registry's watch 403s at
  # startup and the process crashloops, which is at least loud, and is how this
  # was found.
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["connections", "corpora"]
    verbs: ["get", "list", "watch"]
  # Reporting sync results back onto the Corpus that asked for them.
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["corpora/status"]
    verbs: ["get", "patch", "update"]
  # The ingestion credentials those Connections name. Read only, and in this
  # namespace only: the broker is the process holding every client's
  # third-party credentials, so its reach into the cluster is what is most
  # worth keeping small.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "connection-broker.fullname" . }}
  # Bound in the KB namespace alongside the Role; the subject SA still lives in
  # the release namespace.
  namespace: {{ include "connection-broker.knowledgeBaseNamespace" . }}
  labels: {{- include "connection-broker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "connection-broker.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "connection-broker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
