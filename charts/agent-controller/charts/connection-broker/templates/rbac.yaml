{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "connection-broker.serviceAccountName" . }}
  labels: {{- include "connection-broker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "connection-broker.fullname" . }}
  labels: {{- include "connection-broker.labels" . | nindent 4 }}
rules:
  # Watching Connections is what makes a CR created after startup take effect
  # without a restart (docs/adr/0020).
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["connections"]
    verbs: ["get", "list", "watch"]
  # The ingestion credentials those Connections name. Read only, and in this
  # namespace only: the broker is the process holding every client's
  # third-party credentials, so its reach into the cluster is what is most
  # worth keeping small.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "connection-broker.fullname" . }}
  labels: {{- include "connection-broker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "connection-broker.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "connection-broker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
