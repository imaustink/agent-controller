{{- if and .Values.catalogSync.enabled .Values.qdrant.host }}
{{- $catalogNs := .Values.catalog.namespace | default .Release.Namespace }}
{{- $kbNs := include "temporal-engine.knowledgeBaseNamespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-temporal-engine-catalog-sync
  labels:
    {{- include "temporal-engine.labels" . | nindent 4 }}
---
# Read access to the catalog CRs, granted in the namespace where
# agent-controller keeps them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-catalog-reader
  namespace: {{ $catalogNs }}
  labels:
    {{- include "temporal-engine.labels" . | nindent 4 }}
rules:
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["tools", "skills", "agents"]
    verbs: ["get", "list", "watch"]
  {{- if and .Values.knowledgeBases.enabled (eq $kbNs $catalogNs) }}
  # Knowledge bases (docs/adr/0039, 0043). A KnowledgeBase derives the Skill
  # that is actually selected, and a Corpus contributes its members — so this
  # process has to watch both, plus the Connection they resolve through.
  #
  # Without them the informers this env enables cannot list, and the catalog
  # this engine SERVES TURNS FROM simply never gains a knowledge-base skill:
  # every turn answers "no existing skill or agent matched this request" while
  # the other engine's catalog has it.
  #
  # Only here when the KB namespace is the catalog namespace; a distinct KB
  # namespace gets its own Role/RoleBinding below.
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["connections", "corpora", "knowledgebases"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-catalog-reader
  namespace: {{ .Values.catalog.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal-engine.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-catalog-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-temporal-engine-catalog-sync
    namespace: {{ .Release.Namespace }}
---
{{- if and .Values.knowledgeBases.enabled (ne $kbNs $catalogNs) }}
# When knowledge bases live in a namespace of their own
# (knowledgeBases.namespace or global.knowledgeBaseNamespace), the KB CR read
# grant has to be a Role THERE — catalog-sync watches Corpus/KnowledgeBase in
# that namespace and its informers cannot list without it. Still namespaced; the
# subject SA stays in the release namespace, and that namespace must exist.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-catalog-reader-kb
  namespace: {{ $kbNs }}
  labels:
    {{- include "temporal-engine.labels" . | nindent 4 }}
rules:
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["connections", "corpora", "knowledgebases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-catalog-reader-kb
  namespace: {{ $kbNs }}
  labels:
    {{- include "temporal-engine.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-catalog-reader-kb
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-temporal-engine-catalog-sync
    namespace: {{ .Release.Namespace }}
---
{{- end }}
{{- if .Values.catalogSync.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-temporal-engine-catalog-sync
  labels:
    {{- include "temporal-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: catalog-sync
  template:
    metadata:
      labels:
        {{- include "temporal-engine.labels" . | nindent 8 }}
        app.kubernetes.io/component: catalog-sync
    spec:
      serviceAccountName: {{ .Release.Name }}-temporal-engine-catalog-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-sync
          image: "{{ .Values.catalogSync.image.repository }}:{{ .Values.catalogSync.image.tag }}"
          imagePullPolicy: {{ .Values.catalogSync.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CATALOG_NAMESPACE
              value: {{ .Values.catalog.namespace | default .Release.Namespace | quote }}
            {{- if .Values.knowledgeBases.enabled }}
            # Gates the Corpus/KnowledgeBase informers (internal/catalog/watch.go).
            # Unset, this process indexes tools, skills and agents and silently
            # ignores every knowledge base in the cluster.
            - name: AGENT_KNOWLEDGE_BASES_ENABLED
              value: "true"
            # Namespace the Corpus/KnowledgeBase informers watch — may differ
            # from CATALOG_NAMESPACE so knowledge bases live in their own
            # namespace (watch.go splits to a second informer factory).
            - name: KNOWLEDGE_BASE_NAMESPACE
              value: {{ $kbNs | quote }}
            {{- end }}
            {{- include "temporal-engine.qdrantEnv" . | nindent 12 }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.llm.baseURL | quote }}
            - name: OPENAI_EMBED_MODEL
              value: {{ .Values.llm.embedModel | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.secretName }}
                  key: OPENAI_API_KEY
          resources:
            {{- toYaml .Values.catalogSync.resources | nindent 12 }}
{{- end }}
{{- end }}
