{{- if .Values.gateway.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-temporal-engine-gateway
  labels:
    {{- include "temporal-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "temporal-engine.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ .Release.Name }}-temporal-engine-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          {{- if .Values.gateway.preStopSleepSeconds }}
          # Same race, one hop over, as agent-orchestrator's own preStop.
          #
          # This gateway is also accept-then-poll, so it too has no in-flight
          # request to drain and exits promptly on SIGTERM, while kube-proxy
          # applies endpoint changes at most once a second. agent-orchestrator
          # polls it for the whole of every turn on the Temporal engine (ADR
          # 0036, the default engine), so a connection opened into that gap
          # waits out a ~10.5s connect timeout on a dead address and the turn
          # in flight is lost to a routine rollout.
          #
          # Sleeping here keeps this pod reachable until every proxy has
          # stopped pointing at it. The orchestrator's client retries network
          # errors as well; this is the half that does not depend on the caller.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.gateway.preStopSleepSeconds }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "temporal-engine.temporalEnv" . | nindent 12 }}
            - name: GATEWAY_ADDR
              value: ":8080"
            {{/*
            The identity map is keyed BY the bearer token, so a values file is
            the wrong home for it: anything that carries values into version
            control publishes every token in it. The Secret form holds the same
            JSON under a key, and takes precedence — the same shape
            agent-orchestrator already uses for its own identity map.
            */}}
            {{- if .Values.gateway.identity.staticIdentitiesExistingSecret }}
            - name: STATIC_IDENTITIES
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.identity.staticIdentitiesExistingSecret }}
                  key: {{ .Values.gateway.identity.staticIdentitiesExistingSecretKey }}
            {{- else if .Values.gateway.identity.staticIdentities }}
            - name: STATIC_IDENTITIES
              value: {{ .Values.gateway.identity.staticIdentities | quote }}
            {{- end }}
            {{- with .Values.gateway.identity.defaultSubject }}
            - name: AGENT_DEFAULT_SUBJECT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.identity.defaultRoles }}
            - name: AGENT_DEFAULT_ROLES
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.toolrun.enabled }}
            - name: CALLBACK_ADDR
              value: ":8081"
            - name: AGENT_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.callback.secretName }}
                  key: {{ .Values.callback.secretKey }}
            {{- end }}
            {{- with .Values.gateway.senderAssertion.secretName }}
            # Signed sender assertion (docs/adr/0030 §6). With this set, a sender
            # login is accepted ONLY from a verified assertion and the unsigned
            # body field is ignored entirely — which is also how
            # agent-orchestrator vouches for a login when it forwards a turn
            # here, rather than the hop being trusted for being internal. Unset
            # is a supported weaker mode that both ends announce at startup.
            - name: GATEWAY_SENDER_ASSERTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.gateway.senderAssertion.secretKey }}
            {{- end }}
            # The gateway watches IntegrationRoute CRs for deterministic
            # dispatch, so it needs to know where the catalog lives.
            - name: CATALOG_NAMESPACE
              value: {{ .Values.catalog.namespace | default .Release.Namespace | quote }}
            {{- if .Values.qdrant.host }}
            # Caller-supplied tools (docs/adr/0035) are ranked here, in their own
            # collection.
            {{- include "temporal-engine.qdrantEnv" . | nindent 12 }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.secretName }}
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              value: {{ .Values.llm.baseURL | quote }}
            - name: OPENAI_EMBED_MODEL
              value: {{ .Values.llm.embedModel | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.toolrun.enabled }}
            - name: callback
              containerPort: 8081
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
{{- end }}
