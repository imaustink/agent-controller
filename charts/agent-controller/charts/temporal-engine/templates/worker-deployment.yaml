{{- if .Values.worker.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-temporal-engine-worker
  labels:
    {{- include "temporal-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "temporal-engine.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if .Values.toolrun.enabled }}
      serviceAccountName: {{ .Release.Name }}-temporal-engine-worker
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "temporal-engine.temporalEnv" . | nindent 12 }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.llm.baseURL | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: OPENAI_EMBED_MODEL
              value: {{ .Values.llm.embedModel | quote }}
            {{- if .Values.qdrant.host }}
            {{- include "temporal-engine.qdrantEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.toolrun.enabled }}
            - name: TOOLRUN_MODE
              value: "k8s"
            - name: TOOLRUN_NAMESPACE
              value: {{ .Values.catalog.namespace | default .Release.Namespace | quote }}
            - name: CATALOG_NAMESPACE
              value: {{ .Values.catalog.namespace | default .Release.Namespace | quote }}
            - name: CALLBACK_BASE_URL
              value: {{ include "temporal-engine.callbackBaseURL" . | quote }}
            - name: CALLBACK_SECRET_NAME
              value: {{ .Values.callback.secretName | quote }}
            - name: CALLBACK_SECRET_KEY
              value: {{ .Values.callback.secretKey | quote }}
            {{- end }}
            {{- with .Values.nats.url }}
            # Bridged pod agents: an unmodified AgentRun over the existing
            # protocol (docs/pod-agents.md). Absent leaves the declarative loop
            # and checkpoint-resume step tools.
            - name: AGENT_NATS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.identityLink.gatewayUrl }}
            - name: IDENTITY_LINK_GATEWAY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.identityLink.tokenSecretName }}
            - name: IDENTITY_LINK_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.identityLink.tokenSecretKey }}
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.secretName }}
                  key: OPENAI_API_KEY
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
