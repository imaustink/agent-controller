{{- if .Values.worker.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-temporal-engine-worker
  labels:
    {{- include "temporal-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "temporal-engine.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if .Values.toolrun.enabled }}
      serviceAccountName: {{ .Release.Name }}-temporal-engine-worker
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "temporal-engine.temporalEnv" . | nindent 12 }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.llm.baseURL | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: OPENAI_EMBED_MODEL
              value: {{ .Values.llm.embedModel | quote }}
            {{- if .Values.qdrant.host }}
            {{- include "temporal-engine.qdrantEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.toolrun.enabled }}
            - name: TOOLRUN_MODE
              value: "k8s"
            - name: TOOLRUN_NAMESPACE
              value: {{ .Values.catalog.namespace | default .Release.Namespace | quote }}
            - name: CATALOG_NAMESPACE
              value: {{ .Values.catalog.namespace | default .Release.Namespace | quote }}
            - name: CALLBACK_BASE_URL
              value: {{ include "temporal-engine.callbackBaseURL" . | quote }}
            - name: CALLBACK_SECRET_NAME
              value: {{ .Values.callback.secretName | quote }}
            - name: CALLBACK_SECRET_KEY
              value: {{ .Values.callback.secretKey | quote }}
            {{- end }}
            {{- with .Values.nats.url }}
            # Bridged pod agents: an unmodified AgentRun over the existing
            # protocol (docs/pod-agents.md). Absent leaves the declarative loop
            # and checkpoint-resume step tools.
            - name: AGENT_NATS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.worker.idleTimeoutSeconds }}
            # Same env var name and meaning as agent-orchestrator's own
            # AGENT_IDLE_TIMEOUT_SECONDS: bounds SILENCE from a bridged agent,
            # not wall-clock turn duration. Both engines must honor the same
            # window since a bridged agent's Job speaks the same NATS protocol
            # regardless of which engine is driving the episode.
            - name: AGENT_IDLE_TIMEOUT_SECONDS
              value: {{ .Values.worker.idleTimeoutSeconds | quote }}
            {{- end }}
            {{- with .Values.github.apiUrl }}
            - name: GITHUB_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.github.defaultOwner }}
            - name: AGENT_DEFAULT_GITHUB_OWNER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.identityLink.gatewayUrl }}
            - name: IDENTITY_LINK_GATEWAY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.identityLink.tokenSecretName }}
            - name: IDENTITY_LINK_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.identityLink.tokenSecretKey }}
            {{- end }}
            {{- if .Values.knowledgeBases.enabled }}
            # Knowledge bases (docs/adr/0039). The worker registers its
            # knowledge-base activities only when the broker URL is set, and
            # logs that it has disabled them otherwise — so a worker never told
            # about the broker fails every knowledge-base turn with an
            # unregistered activity rather than anything that names the cause.
            - name: CONNECTION_BROKER_URL
              value: {{ .Values.knowledgeBases.brokerUrl | quote }}
            - name: CONNECTION_BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.knowledgeBases.brokerTokenSecret.name }}
                  key: {{ .Values.knowledgeBases.brokerTokenSecret.key }}
            {{- end }}
            {{- if .Values.mcp.enabled }}
            # MCP tools (docs/adr/0045). The worker registers its RunMCPTool
            # activity only when the broker URL is set, and logs that it has
            # disabled it otherwise — so a worker never told about the mcp-broker
            # fails every MCP tool call with an unregistered activity rather than
            # anything that names the cause. The token is this engine's gate to
            # the broker, distinct from the per-user delegated token it forwards
            # per call (ADR 0045 §5).
            - name: MCP_BROKER_URL
              value: {{ .Values.mcp.brokerUrl | quote }}
            - name: MCP_BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.brokerTokenSecret.name }}
                  key: {{ .Values.mcp.brokerTokenSecret.key }}
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.secretName }}
                  key: OPENAI_API_KEY
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
