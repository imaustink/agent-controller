# values-production.yaml — agent-controller system chart on the homelab
# cluster (namespace controller-agent). Consumed automatically by
# .github/workflows/deploy.yml on every push to main; formerly lived as
# values-agent-controller.yaml in the private imaustink/homelab repo and was
# fetched cross-repo via a GitHub App token on every deploy -- moved here to
# drop that indirection now that nothing in this file is a real secret (see
# values-minikube-demo.yaml's note: real secrets stay in k8s Secrets
# referenced by name only).
#
# First-time manual install (after creating the namespace, ServiceAccounts,
# secrets and docker-registry-credentials pull secret described in
# imaustink/homelab's kubernetes/manifests/agent-controller/README.md):
#
#   helm dependency update charts/agent-controller/charts/agent-orchestrator
#   helm dependency update charts/agent-controller
#   helm install agent-controller charts/agent-controller -n controller-agent \
#     -f charts/agent-controller/values-production.yaml
#
# Must be installed BEFORE the community-components chart (its Tool/Skill/Agent
# CRs depend on the Tool/Skill/Agent/ToolRun/AgentRun/LocalTool CRDs that this
# chart's core-controller subchart installs).

agent-orchestrator:
  enabled: true
  fullnameOverride: agent-orchestrator

  image:
    repository: ghcr.io/imaustink/agent-controller/agent-orchestrator
    tag: latest
    pullPolicy: Always

  imagePullSecrets:
    - name: docker-registry-credentials

  # Bring-your-own secret: OPENAI_API_KEY, AGENT_CALLBACK_SECRET (required),
  # AGENT_QDRANT_API_KEY (optional), IDENTITY_LINK_GATEWAY_TOKEN (required
  # once identityLink.enabled below is true -- see that block's comment).
  #
  # AGENT_SENDER_ASSERTION_SECRET is required in practice too, and its absence
  # is a real weakness rather than a missing feature: without it the orchestrator
  # trusts the sender login from the /invoke request BODY, unsigned. That field
  # selects the caller's principal and therefore which stored Claude credentials
  # a run receives (docs/adr/0030 §6, 0031), so anything holding the gateway's
  # /invoke token could name a login and be handed that person's credentials.
  # Both processes log a startup WARNING while it is unset. Must match
  # integration-gateway-secrets' GATEWAY_SENDER_ASSERTION_SECRET below exactly --
  # the gateway signs with it and the orchestrator verifies with it, so two
  # different values present as "the sender login vanished" (every webhook turn
  # falls back to the shared service subject and re-prompts) rather than as a
  # signature error.
  #
  # Create/update with:
  #   kubectl create secret generic agent-orchestrator-secrets -n controller-agent \
  #     --from-literal=OPENAI_API_KEY=sk-... \
  #     --from-literal=AGENT_CALLBACK_SECRET=<random-string> \
  #     --from-literal=IDENTITY_LINK_GATEWAY_TOKEN=<same value as
  #       integration-gateway-secrets' GATEWAY_IDENTITY_LINK_TOKEN below> \
  #     --from-literal=AGENT_SENDER_ASSERTION_SECRET=<same value as
  #       integration-gateway-secrets' GATEWAY_SENDER_ASSERTION_SECRET below>
  #   # (or `kubectl edit secret agent-orchestrator-secrets -n controller-agent`
  #   # / patch it if the Secret already exists)
  secrets:
    existingSecret: agent-orchestrator-secrets

  # Per-user GitHub identity linking (docs/adr/0022): lets agent-orchestrator
  # resolve/inject a caller's own linked GitHub token instead of a shared
  # bot/PAT credential, for any Agent that declares identityProviders.
  # Requires PR #47 (integration-gateway's opt-in startup-check fix) merged
  # FIRST, and integration-gateway.identityLink below configured with the
  # same GitHub App. Enabling this here is inert by itself -- opencode-swe-agent
  # (charts/community-components) still doesn't declare identityProviders
  # yet, so nothing actually uses this path until that's flipped on
  # separately, once the linking flow is verified end-to-end.
  identityLink:
    enabled: true
    # Matches this umbrella chart's default subchart naming (no
    # fullnameOverride set on the integration-gateway block below, and the
    # release name is "agent-controller"), which Helm's standard
    # <release>-<chart> fullname template resolves to
    # "agent-controller-integration-gateway".
    gatewayUrl: "http://agent-controller-integration-gateway:8090"
    # integration-gateway's Connections page (docs/adr/0046). Set together
    # with that chart's connections.enabled below -- not before, or chat
    # prompts would point at a page that 404s.
    connectionsUrl: "https://gateway.kurpuis.com/connections"

  config:
    # This cluster has no Temporal deployment at all (see temporal-engine.enabled
    # below) -- clear the umbrella chart's own default of "temporal"
    # (charts/agent-controller/values.yaml, docs/adr/0036's rollout default) so
    # every turn runs the in-process LangGraph loop instead of being forwarded
    # to a gateway Service backed by pods that were never buildable here.
    # Helm deep-merges this `config` map key-by-key against that default, so
    # omitting this key (rather than setting it) would silently inherit
    # "temporal" -- which is exactly what had been happening.
    agentEngine: ""
    temporalEngineUrl: ""
    # oidc against Pocket ID (kubernetes/manifests/services/pocket-id in
    # imaustink/homelab), not Google -- the 2026-07-19 outage was caused by
    # Google id_tokens: neither caller could present one (Open WebUI has no
    # way to obtain one for its backend-to-backend calls, and
    # integration-gateway -- a server-to-server webhook relay, no user login
    # flow -- can't mint one at all).
    #
    # integration-gateway is this repo's own code and does real
    # client_credentials against Pocket ID -- its granted permission keys
    # land in the JWT's `scp` claim (a real JSON array -- see
    # imaustink/homelab's
    # kubernetes/manifests/services/pocket-id/provision-agent-orchestrator.sh),
    # which oidcRolesClaim below reads.
    #
    # Open WebUI structurally cannot do the same (a static API-key field, no
    # refresh mechanism of its own) -- rather than force it through an IdP
    # flow it can't sustain, it authenticates via the
    # staticIdentitiesExistingSecret fallback below (chart 0.2.2+:
    # CompositeIdentityResolver -- oidc verification first, falling back to
    # this static map only for tokens that fail it). integration-gateway
    # still must pass real oidc verification; only Open WebUI's token gets
    # this pass.
    identityResolver: oidc
    oidcIssuer: "https://pocket-id.kurpuis.com"
    oidcJwksUri: "https://pocket-id.kurpuis.com/.well-known/jwks.json"
    # The Custom API "resource" provisioned in Pocket ID -- see
    # provision-agent-orchestrator.sh. integration-gateway requests this as
    # the client_credentials `resource` param.
    oidcAudience: "https://agent-orchestrator.controller-agent.svc.cluster.local"
    oidcRolesClaim: scp
    # JSON map of bearer token -> {subject, roles}, sourced from a Secret
    # created out-of-band (never committed -- this values file is public).
    # One entry: Open WebUI's long-lived static token. See
    # imaustink/homelab's README for the kubectl command that creates it.
    staticIdentitiesExistingSecret: agent-orchestrator-openwebui-static-identity
    staticIdentitiesExistingSecretKey: AGENT_STATIC_IDENTITIES
    # Same Secret Open WebUI's own FORWARD_USER_INFO_HEADER_JWT_SECRET reads
    # (see openwebui.config.extraEnvVars above) -- lets
    # OpenWebUiForwardedUserResolver verify Open WebUI's per-request signed
    # X-OpenWebUI-User-Jwt header and resolve each Open WebUI user to their
    # OWN subject, instead of every Open WebUI user sharing the single
    # subject the static map above assigns to Open WebUI's static bearer
    # token. Required for the identity-link feature (ADR 0022) to be safe
    # under multiple Open WebUI users -- without this, whichever user links
    # a GitHub identity first makes it usable by every other Open WebUI user
    # with no authentication at all.
    openWebUiUserJwtSecretExistingSecret: openwebui-forward-jwt-secret
    openWebUiUserJwtSecretExistingSecretKey: secret

  # Invoke API stays internal — no ingress, only Open WebUI (in-cluster) calls it.
  ingress:
    enabled: false

  # Bundled Qdrant vector store (github.com/qdrant/qdrant-helm). No external
  # Qdrant exists in this cluster, so this single-replica dev/demo instance
  # backs the RAG tool/skill selection. See charts/agent-orchestrator's
  # values.yaml for the production caveats (no backup/DR story).
  qdrant:
    enabled: true

  # The orchestrator unconditionally lists LocalTool CRs at startup even
  # though no LocalTool CRs are deployed by community-components today, so
  # the Role needs the `localtools` grant that only ships when this is
  # enabled (see charts/agent-orchestrator/templates/rbac.yaml).
  #
  # Executor sidecars for all 4 runtimes: this repo's release.yml CI
  # builds+pushes ghcr.io/imaustink/agent-controller/localtool-executor-<runtime> on
  # every merge to main, so point the chart's default `<runtime>:latest`
  # images at those public GHCR packages instead of leaving runtimes empty.
  # Requires unprivileged user namespaces enabled on every node (bubblewrap
  # per-invocation sandboxing, see charts/agent-orchestrator's own
  # values.yaml comment + docs/adr/0014) — the sidecar's
  # securityContext.seccompProfile is Unconfined by chart default for
  # exactly this reason.
  localTool:
    enabled: true
    runtimes:
      - name: node
        image: ghcr.io/imaustink/agent-controller/localtool-executor-node:latest
      - name: python
        image: ghcr.io/imaustink/agent-controller/localtool-executor-python:latest
      - name: go
        image: ghcr.io/imaustink/agent-controller/localtool-executor-go:latest
      - name: shell
        image: ghcr.io/imaustink/agent-controller/localtool-executor-shell:latest
    pullPolicy: Always

  # Agent delegation (Agent CRs, e.g. opencode-swe-agent) only runs over NATS
  # (ADR 0010/0017) -- without this, AGENT_NATS_URL is never set on the
  # orchestrator and it silently degrades to skills-only: no "agents" Qdrant
  # collection ever gets created, so it never finds an Agent CR to delegate
  # to. The umbrella chart's top-level `nats.enabled` below deploys the NATS
  # server itself; this just tells the orchestrator to use it.
  nats:
    enabled: true

  # Conversation sessions (docs/adr/0016) and integration-gateway's session
  # pages. Points at "agent-orchestrator-redis"
  # (charts/integration-gateway/values.yaml), which only exists when this
  # chart's own templates/redis.yaml is rendered -- leaving this at its default
  # (false) with identityLink on made integration-gateway crash-loop on
  # ENOTFOUND agent-orchestrator-redis.
  #
  # Deliberately EPHEMERAL (--save "" --appendonly no, on an emptyDir): a restart
  # costs in-flight conversations and posted session-page links, and nothing
  # else. Credentials used to be in here too, which is what made that restart an
  # incident -- it deleted every identity link and Claude credential in the
  # cluster and asked already-authorized users to link again. Those are
  # Kubernetes Secrets as of docs/adr/0034, which is why this can stay a cache.
  # Do not move durable state back into it without giving it persistence first.
  redis:
    enabled: true

# No Temporal cluster exists in this environment (docs/adr/0036 "Assumes a
# reachable Temporal cluster; no server is bundled") -- override the umbrella
# chart's own default of enabled: true (charts/agent-controller/values.yaml)
# so this release stops deploying the gateway/worker Deployments here. Without
# this they run permanently in ImagePullBackOff (their image names have no
# registry prefix, so containerd resolves them against Docker Hub, which has
# never had them) while agent-orchestrator.config.agentEngine above still
# forwarded every turn to the (nonexistent) gateway -- the underlying cause of
# turns failing with a bare "fetch failed".
temporal-engine:
  enabled: false

core-controller:
  enabled: true
  fullnameOverride: core-controller

  image:
    repository: ghcr.io/imaustink/agent-controller/core-controller
    tag: latest
    pullPolicy: Always

  # Every tool/agent image here (recipe-scraper, claude-code-swe-agent, etc.)
  # is also pushed to GHCR under a mutable ":latest" tag, same
  # as core-controller's own image above -- so the Jobs core-controller
  # launches need "Always" too, or a node that already pulled a tag once will
  # keep running that stale digest through every later push+redeploy.
  runJob:
    imagePullPolicy: Always

  # Must match the actual in-cluster NATS Service (the release-name-prefixed
  # "agent-controller-nats", not the chart's placeholder default
  # "nats://nats:4222", which doesn't resolve to anything in this namespace).
  # This is the URL core-controller stamps into every AgentRun Job it
  # launches -- get it wrong and every delegated agent (opencode-swe-agent)
  # crashes on startup trying to reach NATS.
  nats:
    agentUrl: "nats://agent-controller-nats.controller-agent.svc.cluster.local:4222"

  imagePullSecrets:
    - name: docker-registry-credentials

# GitHub Issues adapter (phase 1 of the integrations-gateway proposal) —
# relays GitHub issue/comment webhooks into agent-orchestrator's existing
# conversational /invoke API, one session per issue.
integration-gateway:
  enabled: true

  image:
    repository: ghcr.io/imaustink/agent-controller/integration-gateway
    tag: latest
    pullPolicy: Always

  imagePullSecrets:
    - name: docker-registry-credentials

  config:
    # Loop prevention — the gateway ignores comments authored by this login.
    githubBotLogin: "agent-controller[bot]"
    # The ai-triage / ai-review labels are no longer gateway config: they live
    # in community-components' EventTriggers (values-production.yaml
    # eventTriggers.*.label), matched in CEL by the orchestrator (ADR 0048).
    # DEV/TEST-GRADE static allowlist mapping GitHub logins to identities --
    # kept only as CompositeGithubIdentityResolver's last-resort fallback now
    # that githubCollaboratorRoles below is the primary, prod-grade path (no
    # commit/redeploy needed to add/remove a person). JSON:
    # {"<login>": {"subject": "...", "roles": [...]}}
    githubIdentities: '{"imaustink": {"subject": "imaustink", "roles": ["writer"]}}'
    # Left empty: imaustink/agent-controller is a personal-account repo, not
    # org-owned, so there's no GitHub org/team to check membership against
    # (src/identity.ts's GithubTeamMembershipResolver needs an org). Set this
    # instead of/in addition to githubCollaboratorRoles below only if this
    # repo is ever transferred to (or a team created under) a GitHub
    # Organization -- example: '{"my-org/writers": ["writer"]}'.
    githubTeamRoles: ""
    # PROD-GRADE primary identity source for this personal-account repo
    # (src/identity.ts's GithubCollaboratorPermissionResolver): grants roles
    # by the sender's actual collaborator permission on the repo the webhook
    # fired on, instead of the static map above. "admin" is the repo owner
    # (imaustink) and any collaborator granted Owner-equivalent access;
    # "write" is anyone added as a collaborator with Write access -- both map
    # to "writer" since either is sufficient to reach the SWE agent
    # (allowedRoles: [writer]). Adding/removing a person from here on out is
    # just a GitHub "Settings -> Collaborators" change on this repo.
    githubCollaboratorRoles: '{"admin": ["writer"], "write": ["writer"]}'
    # Must comfortably exceed agent-orchestrator's own AGENT_RUN_TIMEOUT_SECONDS
    # (default 28800s/8h -- the wall-clock ceiling on a real
    # opencode-swe-agent run: clone, run Claude, open a PR, iterate). The
    # chart default here (15 min) is far shorter, so a real task taking longer
    # than 15 minutes would finish successfully just AFTER the gateway had
    # already given up polling and posted a "no terminal result within
    # 900000ms" comment -- confirmed happening in practice. Same class of bug
    # as the orchestrator's old "produced no reply" timeout: a bound shorter
    # than the work it's bounding turns a success into a visible failure.
    # 8h5m leaves a 5-minute buffer past the agent-run ceiling.
    #
    # DELIBERATELY NOT shortened to shrink the trigger-label "orphan window":
    # this gateway holds its relay (and so its in-process label-removal
    # `finally`) for as long as a poll runs, so a shorter bound would shrink how
    # long a stranded label waits -- BUT only by reintroducing exactly the
    # false-timeout bug above for every legitimate run between the new bound and
    # the real 8h run ceiling (agentRunTimeoutSeconds is unset here, so the Job
    # really can run the full 8h). The orphan window is now closed the right way
    # instead: label removal is retried on transient GitHub failures
    # (github-client.ts) and, if the pod dies before the `finally` runs at all, a
    # durable reconciling sweep (integration-gateway's label-reconciler.ts)
    # removes the stranded label on the next pass -- neither of which depends on
    # this value. If this ever IS lowered to ~1h, lower agentRunTimeoutSeconds
    # (agent-orchestrator subchart) to match in the SAME change, or long runs
    # regress to the false-timeout comment.
    pollTimeoutMs: "29100000"

  # Automatic OIDC client_credentials token fetch/refresh (previously a
  # documented, unbuilt follow-up -- Pocket ID's client_credentials access
  # tokens expire in a fixed 1 hour, and until this was built the gateway
  # just read a static, manually-rotated GATEWAY_ORCHESTRATOR_TOKEN that went
  # stale every hour with no one automatically noticing). Now the gateway
  # holds the "integration-gateway" Pocket ID client's client_secret (which
  # does not expire, only rotates if regenerated) and fetches/caches/renews
  # its own access token as needed.
  orchestratorOidc:
    enabled: true
    tokenEndpoint: "https://pocket-id.kurpuis.com/api/oidc/token"
    clientId: "integration-gateway"
    resource: "https://agent-orchestrator.controller-agent.svc.cluster.local"

  # Bring-your-own secret: GITHUB_WEBHOOK_SECRET,
  # GATEWAY_ORCHESTRATOR_OIDC_CLIENT_SECRET, and GITHUB_TOKEN.
  # GATEWAY_ORCHESTRATOR_OIDC_CLIENT_SECRET is the "integration-gateway"
  # Pocket ID client's client_secret (see
  # kubernetes/manifests/services/pocket-id/provision-agent-orchestrator.sh in
  # imaustink/homelab, or its "regenerate secret" endpoint) -- NOT an access
  # token; the gateway exchanges this for a fresh access token itself as
  # needed, so this key does not go stale on its own.
  #
  # GATEWAY_SENDER_ASSERTION_SECRET signs the gateway's claim about WHICH HUMAN
  # triggered a webhook turn (docs/adr/0030 §6). Any random string; must match
  # agent-orchestrator-secrets' AGENT_SENDER_ASSERTION_SECRET above exactly.
  # While it is unset the login rides to /invoke unsigned and the orchestrator
  # trusts it from the request body -- see that Secret's comment for why that
  # matters. Safe to set here FIRST: the orchestrator ignores the header until
  # its own key exists, and the gateway keeps sending the body field either way.
  #
  # Per-user GitHub identity linking (docs/adr/0022, identityLink.enabled
  # below) needs FOUR more keys in this same Secret: GATEWAY_IDENTITY_LINK_TOKEN
  # (any random string -- must match agent-orchestrator-secrets'
  # IDENTITY_LINK_GATEWAY_TOKEN above exactly), IDENTITY_LINK_ENCRYPTION_KEY
  # (32-byte AES-256-GCM key, base64), IDENTITY_LINK_STATE_SECRET (distinct
  # random key -- do NOT reuse the encryption key, so rotating one never
  # forces rotating the other), and GITHUB_APP_CLIENT_SECRET (generated on
  # the GitHub App's own settings page -- device flow never needed one, the
  # authorization-code flow does).
  #
  # DO NOT MERGE identityLink.enabled=true below before creating/updating
  # this Secret with all four -- deploy.yml auto-applies on every push to
  # main, and integration-gateway will otherwise fail to start
  # (CreateContainerConfigError, missing Secret keys).
  #
  # Create/update with:
  #   kubectl create secret generic integration-gateway-secrets -n controller-agent \
  #     --from-literal=GITHUB_WEBHOOK_SECRET="$(openssl rand -hex 32)" \
  #     --from-literal=GATEWAY_ORCHESTRATOR_OIDC_CLIENT_SECRET=<Pocket ID client_secret> \
  #     --from-literal=GITHUB_TOKEN=github_pat_... \
  #     --from-literal=GATEWAY_IDENTITY_LINK_TOKEN="$(openssl rand -hex 32)" \
  #     --from-literal=IDENTITY_LINK_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
  #     --from-literal=IDENTITY_LINK_STATE_SECRET="$(openssl rand -base64 32)" \
  #     --from-literal=GITHUB_APP_CLIENT_SECRET=<from the GitHub App's settings page> \
  #     --from-literal=GATEWAY_SENDER_ASSERTION_SECRET="$(openssl rand -hex 32)"
  #   # (or `kubectl edit secret integration-gateway-secrets -n controller-agent`
  #   # if it already exists -- just add/replace the relevant keys)
  secrets:
    existingSecret: integration-gateway-secrets

  # Per-user GitHub identity linking (docs/adr/0022) -- see the secrets
  # comment above for the required Secret keys, and the setup checklist in
  # this PR's description for the GitHub App-side steps (Device Flow
  # enabled, client secret generated, callback URL registered).
  identityLink:
    enabled: true
    # GitHub App OAuth client_id -- PUBLIC, not a secret (see this field's
    # doc comment in charts/agent-controller/charts/integration-gateway/values.yaml).
    # This is the App's Client ID (Iv1./Iv23... string), NOT its numeric App ID.
    githubAppClientId: "Iv23liVElRYG8F7GBzRy"
    # Must exactly match the GitHub App's registered "Callback URL"
    # (scheme/host/path/trailing-slash all significant) -- see
    # charts/agent-controller/charts/integration-gateway/values.yaml's
    # githubOauthRedirectUri comment for the same discipline
    # GOOGLE_REDIRECT_URI already follows elsewhere in this file.
    githubOauthRedirectUri: "https://gateway.kurpuis.com/identity-link/github/callback"

  # Session page (issue #81/ADR 0025/0026) -- was never turned on in
  # production before now; required as a prerequisite for claudeAuth below
  # (the claude-auth link page needs a reachable public host the same way
  # the session page itself does), and as a side effect also turns on the
  # "starting work" comment + live turn-history page for the ai-triage
  # trigger generally. redisUrl is left unset -- it falls back to
  # identityLink.redisUrl (see that field's comment in
  # charts/agent-controller/charts/integration-gateway/values.yaml).
  #
  # That Redis is ephemeral, so a posted page link dies with its pod. Tolerable
  # (the link 404s) and unlike a credential, which is why only the credentials
  # moved to Secrets in docs/adr/0034. Worth fixing separately.
  sessionPage:
    publicBaseUrl: "https://gateway.kurpuis.com"

  # Per-user Claude Code OAuth linking (docs/adr/0027) -- the `claude`
  # provider's counterpart to identityLink above, for claude-code-swe-agent
  # (charts/community-components/values-production.yaml). Reuses
  # identityLink's encryption-key/bearer-token config and requires
  # sessionPage.publicBaseUrl above; requires this integration-gateway image
  # to actually have the `claude` CLI + node-pty compiled in (both stages of
  # apps/integration-gateway/Dockerfile changed for this).
  claudeAuth:
    enabled: true

  # Connections page (docs/adr/0046) at https://gateway.kurpuis.com/connections.
  # ON. The gateway pod will not start without steps 1 and 2 done first:
  #   1. Create a confidential Pocket ID OIDC client "agent-connections" with
  #      callback URL https://gateway.kurpuis.com/connections/callback:
  #      imaustink/homelab's
  #      kubernetes/manifests/services/pocket-id/provision-agent-connections.sh.
  #   2. Add its secret to integration-gateway-secrets as
  #      GATEWAY_CONNECTIONS_OIDC_CLIENT_SECRET (the script prints the command).
  #   3. agent-orchestrator.identityLink.connectionsUrl (near the top of this
  #      file) set to "https://gateway.kurpuis.com/connections".
  # Pocket ID users must have a verified email (the page refuses unverified
  # ones), and it must be the same email their Open WebUI account carries.
  connections:
    enabled: true
    oidc:
      issuer: "https://pocket-id.kurpuis.com"
      clientId: "agent-connections"

  # GitHub must reach this Service directly (unlike the orchestrator's
  # in-cluster-only callback port).
  ingress:
    enabled: true
    className: traefik
    annotations:
      kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
      # Without this, external-dns defaults new hosts to the Traefik
      # LoadBalancer Service's address (192.168.0.200) -- a private LAN IP
      # Let's Encrypt's HTTP-01 validator can never reach, so issuance fails
      # with "no valid A records found" even though DNS itself resolves fine
      # (same bug fixed for pocket-id.kurpuis.com; see that manifest's
      # comment in imaustink/homelab). CNAME to lab.kurpuis.com (the actual
      # publicly-routable address, same pattern chat.kurpuis.com uses)
      # instead of an A record.
      external-dns.alpha.kubernetes.io/target: lab.kurpuis.com
    host: "gateway.kurpuis.com"
    tls:
      - secretName: gateway-kurpuis-tls
        hosts:
          - "gateway.kurpuis.com"

openwebui:
  enabled: true

  # Sourced from a Secret (chart PR #27) instead of plaintext here, so it
  # doesn't land in the Helm release's stored values. NOT a Pocket ID token --
  # Open WebUI has no refresh mechanism of its own (a static API-key field,
  # read as an env var at container start), so rather than chase Pocket ID's
  # 1-hour client_credentials expiry with a periodic restart job, this is a
  # long-lived, manually-rotated shared secret matched by
  # agent-orchestrator.config.staticIdentitiesExistingSecret above
  # (CompositeIdentityResolver's static fallback -- see that comment).
  # Must be the same value as that Secret's one token entry. Create with:
  #   kubectl create secret generic agent-orchestrator-openwebui-static-identity \
  #     -n controller-agent \
  #     --from-literal=AGENT_STATIC_IDENTITIES='{"<token>": {"subject": "openwebui", "roles": ["reader", "writer"]}}'
  #   kubectl create secret generic openwebui-openai-api-key -n controller-agent \
  #     --from-literal=openai-api-key=<same token>
  #
  # GOTCHA (cost real debugging time): Open WebUI persists this Connection's
  # API key into its own Postgres `config` table (key openai.api_keys) the
  # FIRST time it boots, and never re-reads OPENAI_API_KEY from the env
  # again after that -- rotating this Secret and restarting the pod does
  # NOT change what Open WebUI actually sends. To rotate for real: update it
  # in Open WebUI's own Admin Settings -> Connections UI (or the `config`
  # table's `openai.api_keys` row directly), THEN match that same value in
  # agent-orchestrator-openwebui-static-identity above -- not the other way
  # around.
  openaiApiKeyExistingSecret: openwebui-openai-api-key
  openaiApiKeyExistingSecretKey: openai-api-key
  openaiBaseApiUrl: "http://agent-orchestrator-invoke:8081/v1"

  ollama:
    enabled: false
  pipelines:
    enabled: false

  persistence:
    size: 2Gi

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 3Gi

  ingress:
    enabled: true
    class: traefik
    annotations:
      kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
    host: "chat.kurpuis.com"
    tls: true
    existingSecret: "chat-kurpuis-tls"

  # Google OAuth SSO -- disabled (see google.enabled below), Pocket ID is the
  # only SSO path now. Config left in place, not deleted, in case it's ever
  # re-enabled as a fallback; it was only ever ungoverned anyway, since
  # Google can't emit custom roles/groups claims (the same limitation that
  # broke oidc verification against Google in the first place, see
  # values-production.yaml's git history). If re-enabled, the client-secret
  # Secret and Google Cloud Console redirect URI are still:
  #   kubectl create secret generic controller-agent-openwebui-google-oauth \
  #     -n controller-agent --from-literal=client-secret=<GOOGLE_CLIENT_SECRET>
  #   https://chat.kurpuis.com/oauth/google/login/callback
  #
  # Pocket ID OIDC SSO: real per-user login, roles managed via Pocket ID
  # Groups + a custom "roles" claim (see
  # kubernetes/manifests/services/pocket-id/provision-openwebui-sso.sh in
  # imaustink/homelab) -- NOT the same Pocket ID client integration-gateway
  # uses (that one's client_credentials-only, no login flow). Create the
  # client-secret Secret first:
  #   kubectl create secret generic openwebui-pocket-id-oauth -n controller-agent \
  #     --from-literal=client-secret=<POCKET_ID_CLIENT_SECRET>
  # Callback URLs registered on the Pocket ID client must include both
  # https://chat.kurpuis.com/oauth/oidc/callback (what this Open WebUI
  # version actually redirects to) and .../oauth/oidc/login/callback (a
  # newer route also present in its source) -- provision-openwebui-sso.sh
  # in imaustink/homelab registers both.
  sso:
    enabled: true
    enableSignup: true
    enableRoleManagement: true
    enableGroupManagement: true
    google:
      # Disabled -- Pocket ID is the only managed SSO path now. Left
      # configured (not deleted) so re-enabling is a one-line flip if ever
      # needed; it was only ever an ungoverned fallback since Google can't
      # emit custom roles/groups claims.
      enabled: false
      clientId: "916932714292-6900thjm1dq3e4fnqrcj3ipe4iud70o8.apps.googleusercontent.com"
      clientExistingSecret: controller-agent-openwebui-google-oauth
      clientExistingSecretKey: "client-secret"
    oidc:
      enabled: true
      clientId: "openwebui"
      clientExistingSecret: openwebui-pocket-id-oauth
      clientExistingSecretKey: "client-secret"
      providerUrl: "https://pocket-id.kurpuis.com/.well-known/openid-configuration"
      providerName: "Pocket ID"
      scopes: "openid email profile groups"
    roleManagement:
      # Pocket ID has no native "roles" concept -- this claim is emitted via
      # a custom claim on a Pocket ID Group (key "roles", JSON array value),
      # not anything built-in. See provision-openwebui-sso.sh.
      rolesClaim: "roles"
      allowedRoles: "user,admin"
      adminRoles: "admin"
    groupManagement:
      # Pocket ID's native group-name list (no custom claim needed) --
      # matches Open WebUI Groups by name if you create ones with matching
      # names. Unused for role assignment (see roleManagement above).
      groupsClaim: "groups"

  # NOTE: Helm replaces arrays wholesale — every entry must stay together here.
  extraEnvVars:
    - name: GOOGLE_REDIRECT_URI
      value: "https://chat.kurpuis.com/oauth/google/login/callback"
    # Pocket ID is the only way in. A local password account carries an email
    # nobody verified, and the Connections page (docs/adr/0046) maps a
    # Pocket ID sign-in to the Open WebUI account with the same email -- so a
    # password account registered under someone else's address could
    # receive their connections.
    #
    # Blocks password SIGN-IN (and LDAP) only. SIGN-UP is gated by "Enable
    # New Sign Ups" and the login-form setting, which live in Open WebUI's
    # database and ignore env after first boot -- an admin must turn sign-ups
    # off in Admin Settings > General (routers/auths.py, checked at v0.10.2).
    #
    # No local-admin break-glass remains: if Pocket ID is down, nobody can
    # log in until it is back.
    - name: ENABLE_PASSWORD_AUTH
      value: "false"
    - name: ENABLE_FORWARD_USER_INFO_HEADERS
      value: "true"
    # Switches ENABLE_FORWARD_USER_INFO_HEADERS from the legacy plaintext
    # X-OpenWebUI-User-* headers to a single signed JWT
    # (X-OpenWebUI-User-Jwt, HS256, minted fresh on every outbound request --
    # no refresh problem, unlike Pocket ID's client_credentials tokens).
    # Verified by agent-orchestrator's OpenWebUiForwardedUserResolver (see
    # agent-orchestrator.config.openWebUiUserJwtSecretExistingSecret below,
    # pointed at this same Secret) -- until that was wired up, every Open
    # WebUI user resolved to the SAME shared subject via the
    # CompositeIdentityResolver static fallback, so any OAuth identity one
    # user linked (e.g. GitHub, ADR 0022) was usable by every other Open
    # WebUI user with no authentication at all.
    - name: FORWARD_USER_INFO_HEADER_JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: openwebui-forward-jwt-secret
          key: secret
    # ---- Database (CNPG Postgres — see imaustink/homelab's
    # manifests/agent-controller/003-openwebui-postgres.yaml) ----
    # Replaces the default SQLite file, which has no retry/failover behavior
    # and turned a transient Longhorn replica blip into a full outage.
    - name: DATABASE_TYPE
      value: "postgres"
    - name: DATABASE_HOST
      value: "agent-controller-openwebui-postgres-rw"
    - name: DATABASE_PORT
      value: "5432"
    - name: DATABASE_NAME
      value: "openwebui"
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: agent-controller-openwebui-postgres-app
          key: username
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: agent-controller-openwebui-postgres-app
          key: password

# Bundled NATS server (nats subchart) backing agent delegation's result
# channel (agent-orchestrator.nats.enabled + core-controller.nats.agentUrl
# above both depend on this actually running). Pinning explicitly rather
# than relying on Helm's implicit "enabled if condition path is unset"
# fallback, which is what let this stay on accidentally with no NATS wiring
# actually pointed at it.
nats:
  enabled: true

# Hand-authored SearXNG instance (chart templates/searxng.yaml, not a Helm
# subchart) backing community-components' web-search Tool. ClusterIP only,
# no Ingress. Requires the searxng-secrets Secret to already exist:
#   kubectl create secret generic searxng-secrets -n controller-agent \
#     --from-literal=secret-key="$(openssl rand -hex 32)"
searxng:
  enabled: true

# Production's GitHub event wiring (docs/adr/0048): the GitHub App's webhook
# source and the four ai-triage / ai-review triggers. They are copies of
# examples/event-triggers/ with agentRef set to claude-code-swe-agent (the SWE
# agent community-components enables here). Installed through extraManifests so
# they share this release's lifecycle; every {{placeholder}} is escaped as
# {{`{{placeholder}}`}} because extraManifests runs each entry through `tpl`.
#
# - github: POST https://gateway.kurpuis.com/webhooks/github, the URL the App was
#   already configured with, verified with integration-gateway-secrets'
#   GITHUB_WEBHOOK_SECRET.
# - claude-code-swe-agent declares the "claude" identity provider, so whoever
#   applied the label must have a linked Claude token for the run to launch.
# - Each posts "Starting work on this now." (+ the session page link), the
#   result, and removes its label when the run ends, so re-applying it
#   re-triggers. The two review triggers are readOnly: no write credentials.
extraManifests:
  # eventsource-github
  - |
    apiVersion: core.controller-agent.dev/v1alpha1
    kind: EventSource
    metadata:
      name: github
    spec:
      webhook:
        verify:
          scheme: hmacSha256
          header: x-hub-signature-256
          prefix: "sha256="
          secretRef:
            name: integration-gateway-secrets
            key: GITHUB_WEBHOOK_SECRET
        deliveryIdHeader: x-github-delivery
      sender:
        provider: github
        loginFrom: body.sender.login
        isBotFrom: body.sender.type == "Bot"
        repositoryFrom: body.repository.full_name
  # eventtrigger-github-issue-triage
  - |
    apiVersion: core.controller-agent.dev/v1alpha1
    kind: EventTrigger
    metadata:
      name: github-issue-triage
    spec:
      sourceRef: github
      match:
        cel: >-
          headers["x-github-event"] == "issues" &&
          body.action == "labeled" &&
          body.label.name == "ai-triage"
      params:
        repository: body.repository.full_name
        number: body.issue.number
        title: body.issue.title
        description: body.issue.body
        label: body.label.name
      sessionKey: "github:{{`{{repository}}`}}#{{`{{number}}`}}"
      target:
        agentRef: "claude-code-swe-agent"
        promptTemplate: |
          GitHub issue {{`{{repository}}`}}#{{`{{number}}`}} was labeled "{{`{{label}}`}}": "{{`{{title}}`}}"

          {{`{{description}}`}}

          Triage and resolve this issue: investigate the {{`{{repository}}`}}
          repository (the repository this issue was filed in), implement a fix or
          feature there if the issue calls for one, and open a pull request against
          {{`{{repository}}`}}. Do not create a new repository and do not
          substitute any other repository, even if you lack permission to do
          something the task seems to ask for (e.g. creating a repo) -- if you
          cannot complete the task in {{`{{repository}}`}} as given, stop
          and post a comment explaining exactly what's blocking you instead of
          working around it elsewhere. If the issue is unclear or you need more
          context before proceeding, post a comment asking a clarifying question
          instead of guessing.

          When you open a pull request, end its description with a short note
          inviting a maintainer to apply the "ai-review" label to the PR to request
          an automated code review, or the "{{`{{label}}`}}" label to have the
          review feedback on it addressed and the branch brought back in sync with
          its base. (The automation cannot apply either label to its own PR, so a
          human applies it.)
      reply:
        github:
          repository: "{{`{{repository}}`}}"
          issueNumber: "{{`{{number}}`}}"
          ack: "🤖 Starting work on this now."
          sessionPage: true
          result: true
          removeLabel: "{{`{{label}}`}}"
  # eventtrigger-github-issue-review
  - |
    apiVersion: core.controller-agent.dev/v1alpha1
    kind: EventTrigger
    metadata:
      name: github-issue-review
    spec:
      sourceRef: github
      match:
        cel: >-
          headers["x-github-event"] == "issues" &&
          body.action == "labeled" &&
          body.label.name == "ai-review"
      params:
        repository: body.repository.full_name
        number: body.issue.number
        title: body.issue.title
        description: body.issue.body
        label: body.label.name
      sessionKey: "github:{{`{{repository}}`}}#{{`{{number}}`}}"
      target:
        agentRef: "claude-code-swe-agent"
        readOnly: true
        promptTemplate: |
          GitHub issue {{`{{repository}}`}}#{{`{{number}}`}} was labeled "{{`{{label}}`}}": "{{`{{title}}`}}"

          {{`{{description}}`}}

          Review this issue. Read the issue and any pull request or code it
          references, then give a concrete, actionable review of the proposal:
          assess whether it is clear and complete, whether the approach is sound,
          what risks or edge cases it misses, and what a maintainer should decide
          before work starts. Post your review as a comment on the issue, being
          specific and citing file:line where the discussion is about existing code.
          Do not implement the change, open a pull request, or push any commits --
          only review.

          Keep it concise -- its value is in the signal, not the volume. Lead with
          the verdict, then the few points that materially change the decision. Skip
          nitpicks, praise, and restating the issue back to its author. A short,
          high-signal review beats an exhaustive one.

          You get exactly one turn to do this -- you cannot pause partway through
          and wait for a CI check, build, or test run to finish, and nothing will
          re-invoke you automatically when one does. Post a complete review now
          based on the issue and code alone. If something you would want is still
          running, mention its current status as one line in the review -- do not
          let it block or delay posting the rest of your assessment, and do not say
          you'll "finalize" or "resume" later.
      reply:
        github:
          repository: "{{`{{repository}}`}}"
          issueNumber: "{{`{{number}}`}}"
          ack: "🤖 Starting work on this now."
          sessionPage: true
          result: true
          removeLabel: "{{`{{label}}`}}"
  # eventtrigger-github-pr-triage
  - |
    apiVersion: core.controller-agent.dev/v1alpha1
    kind: EventTrigger
    metadata:
      name: github-pr-triage
    spec:
      sourceRef: github
      match:
        cel: >-
          headers["x-github-event"] == "pull_request" &&
          body.action == "labeled" &&
          body.label.name == "ai-triage"
      params:
        repository: body.repository.full_name
        number: body.pull_request.number
        title: body.pull_request.title
        description: body.pull_request.body
        label: body.label.name
      sessionKey: "github:{{`{{repository}}`}}#{{`{{number}}`}}"
      target:
        agentRef: "claude-code-swe-agent"
        promptTemplate: |
          Pull request {{`{{repository}}`}}#{{`{{number}}`}} was labeled "{{`{{label}}`}}": "{{`{{title}}`}}"

          {{`{{description}}`}}

          Pick this pull request back up and get it ready to merge. Work only in
          {{`{{repository}}`}} and only on this PR's existing branch -- do
          not open a second pull request, do not create a repository, and do not
          substitute any other repository or branch.

          1. Check out the PR's branch (`gh pr checkout {{`{{number}}`}}`).
          2. Read ALL the feedback on it: the PR description, every review
             (`gh pr view {{`{{number}}`}} --comments`, `gh api` for review
             comments), and any failing checks (`gh pr checks {{`{{number}}`}}`).
          3. Address that feedback in code. Fix the failing checks too. Where you
             disagree with a comment, reply to it explaining why instead of silently
             ignoring it.
          4. Sync the branch with its base branch, resolving any conflicts
             (`gh pr view {{`{{number}}`}} --json baseRefName`, then rebase or
             merge the base in -- match whatever this repository's history already
             does). Push the result to the same branch so the PR itself updates.
          5. Update the PR description if what it says no longer matches what the
             branch does, and post one comment summarizing what you changed in
             response to which feedback, plus anything you deliberately did not do.

          Resolve every review comment you addressed. If something is genuinely
          blocking you -- a comment you cannot act on without a decision, a conflict
          you cannot resolve safely, missing permission -- stop and post a comment
          saying exactly what you need, rather than guessing or working around it
          somewhere else.

          You get exactly one turn to do this -- you cannot pause partway through
          and wait for a CI check, build, or test run to finish, and nothing will
          re-invoke you automatically when one does. Push your work and post your
          summary now. If a check is still running when you finish, say so in one
          line -- do not let it block or delay pushing and summarizing, and do not
          say you'll "finalize" or "resume" later. (The triage label is removed once
          this run ends, so a maintainer can simply re-apply it to have you pick the
          PR up again.)
      reply:
        github:
          repository: "{{`{{repository}}`}}"
          issueNumber: "{{`{{number}}`}}"
          ack: "🤖 Starting work on this now."
          sessionPage: true
          result: true
          removeLabel: "{{`{{label}}`}}"
  # eventtrigger-github-pr-review
  - |
    apiVersion: core.controller-agent.dev/v1alpha1
    kind: EventTrigger
    metadata:
      name: github-pr-review
    spec:
      sourceRef: github
      match:
        cel: >-
          headers["x-github-event"] == "pull_request" &&
          body.action == "labeled" &&
          body.label.name == "ai-review"
      params:
        repository: body.repository.full_name
        number: body.pull_request.number
        title: body.pull_request.title
        description: body.pull_request.body
        label: body.label.name
      sessionKey: "github:{{`{{repository}}`}}#{{`{{number}}`}}"
      target:
        agentRef: "claude-code-swe-agent"
        readOnly: true
        promptTemplate: |
          Pull request {{`{{repository}}`}}#{{`{{number}}`}} was labeled "{{`{{label}}`}}": "{{`{{title}}`}}"

          {{`{{description}}`}}

          Review this pull request. Check out the branch, examine the diff, and
          assess correctness, test coverage, security, and any risks. Post your
          review on the PR as inline comments anchored to the exact file and line at
          issue -- create them as pull-request review comments (e.g. `gh pr review
          {{`{{number}}`}}` with inline comments, or `gh api` on the PR's
          review-comments endpoint) so each renders on its line. Be concrete and
          cite file:line. Do not merge or push changes -- only review.

          Keep the review concise -- its value is in the signal, not the volume.
          Comment only on things that materially affect correctness, security,
          tests, or maintainability, and raise each distinct issue exactly once.
          Skip nitpicks, style preferences a linter would catch, praise, and
          restating what the diff already shows. If you post an overall summary,
          hold it to a few sentences -- the verdict plus the most important issues --
          and let the inline comments carry the detail. A handful of high-signal
          comments beats an exhaustive list.

          Every comment that requests a change must carry its own fix, so the author
          can act on it without leaving the diff -- but exactly ONE fix mechanism per
          comment, never both. Keep the surrounding prose to a sentence or two:

            1. PREFER a GitHub SUGGESTION block whenever the fix is a concrete,
               localized edit to the commented line(s). Put a fenced ```suggestion
               block at the TOP LEVEL of the comment holding the exact, complete
               replacement for the line range the comment is anchored to -- GitHub
               then renders an "Apply suggestion" button the author can commit in one
               click. The block must contain only the corrected replacement for those
               lines; if the fix touches lines you did not anchor to, widen the
               comment's line range to cover them. A suggestion block is
               self-explanatory -- do NOT also add the collapsible prompt below.

            2. ONLY when the fix is not a mechanical line edit (e.g. it is
               architectural or spans several files), fall back to a copy-pasteable
               prompt to fix the issue with an AI coding agent, hidden in a
               collapsible section so it never clutters the comment. Append it at the
               end of the comment exactly like this (keep the blank line after
               </summary> or the block will not render):

                 <details>
                 <summary>🤖 Prompt to fix this with an AI agent</summary>

                 ```text
                 In {{`{{repository}}`}} on PR #{{`{{number}}`}}, fix
                 <problem> at <file:line> so that <acceptance criteria>. Do not
                 change unrelated behavior; add or update a test covering the fix.
                 ```

                 </details>

               Write the prompt as a direct, self-contained instruction (goal,
               affected file:line, concrete acceptance criteria) that another agent
               could act on without re-reading the diff.

          Do NOT open a follow-up issue or ticket -- the fix belongs in the comment
          itself, as the one-click suggestion or the copyable agent prompt. A clean
          approval with nothing to change needs neither, and no comments at all.

          You get exactly one turn to do this -- you cannot pause partway through
          and wait for a CI check, build, or test run to finish, and nothing will
          re-invoke you automatically when one does. Post a complete review now
          based on the diff and code alone. If a check is still running, mention
          its current status as one line in the review (e.g. "CI is still running
          as of this review") -- do not let it block or delay posting the rest of
          your assessment, and do not say you'll "finalize" or "resume" later.
      reply:
        github:
          repository: "{{`{{repository}}`}}"
          issueNumber: "{{`{{number}}`}}"
          ack: "🤖 Starting work on this now."
          sessionPage: true
          result: true
          removeLabel: "{{`{{label}}`}}"
