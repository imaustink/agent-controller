---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: identityproviders.core.controller-agent.dev
spec:
  group: core.controller-agent.dev
  names:
    kind: IdentityProvider
    listKind: IdentityProviderList
    plural: identityproviders
    singular: identityprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.envVar
      name: EnvVar
      type: string
    - jsonPath: .spec.flow
      name: Flow
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IdentityProvider is the Schema for the identityproviders API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of IdentityProvider
            properties:
              crossEntryPoint:
                description: |-
                  crossEntryPoint marks a provider whose credential is keyed by PRINCIPAL
                  rather than by the caller's raw entry-point subject — i.e. one a human
                  re-authorizes by hand and expects to only do once, shared across chat
                  and webhook entry points (docs/adr/0030 §6). Unset (false) keeps a
                  provider's credential scoped to the entry point that obtained it,
                  which is correct for anything establishing or reading the principal
                  itself (e.g. "github").
                type: boolean
              envVar:
                description: |-
                  envVar is the name of the environment variable this provider's resolved
                  token is injected as on a launched AgentRun/ToolRun (AgentLaunchOptions'
                  secretEnv / ToolRunSpec.SecretEnv).
                minLength: 1
                pattern: ^[A-Z][A-Z0-9_]*$
                type: string
              flow:
                default: oauth
                description: |-
                  flow selects which of agent-orchestrator's fixed link-flow
                  implementations backs this provider (docs/adr/0027). Defaults to
                  "oauth", the generic device/authcode flow — set only for the two
                  Claude-specific mechanisms.
                enum:
                - oauth
                - claude-cli-setup-token
                - claude-remote-login
                type: string
              label:
                description: |-
                  label is the human-facing name used in link prompts/messages (e.g.
                  "please link your GitHub account"). Distinct providers MUST use
                  distinct labels — two providers sharing a label make their link
                  prompts indistinguishable to the person completing them (docs/adr/0027
                  learned this the hard way for "claude" vs "claude-remote").
                minLength: 1
                type: string
            required:
            - envVar
            - label
            type: object
          status:
            description: status defines the observed state of IdentityProvider
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the IdentityProvider resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
