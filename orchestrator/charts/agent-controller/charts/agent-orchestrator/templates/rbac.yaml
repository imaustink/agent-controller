{{- if .Values.rbac.create }}
{{- $toolNs := include "agent-orchestrator.toolNamespace" . }}
{{- $kbNs := include "agent-orchestrator.knowledgeBaseNamespace" . }}
{{/*
Namespace-scoped Role (never a ClusterRole, ADR 0005) granting exactly what
the orchestrator's CRD-based registries/launcher use (ADR 0010):
read-only access to the Tool/Skill catalog CRDs, and full CRUD on ToolRun
(the CR it creates per invocation and polls for lifecycle). It no longer
creates k8s Jobs directly -- that's the core-controller's job now (see
charts/core-controller) -- so this Role has NO `batch/jobs` permissions at
all, a meaningfully smaller blast radius than before ADR 0010. Bound in the
tool/Job namespace, which may differ from the release namespace when
`namespace` is set explicitly.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-orchestrator.fullname" . }}
  namespace: {{ include "agent-orchestrator.toolNamespace" . }}
  labels:
    {{- include "agent-orchestrator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["tools", "skills", "agents", "integrationroutes", "identityproviders"]
    verbs: ["get", "list", "watch"]
  {{- if and .Values.knowledgeBases.enabled (eq $kbNs $toolNs) }}
  # Knowledge bases (docs/adr/0039, 0043). The orchestrator derives a skill and
  # its tools from these, so it WATCHES them — and with knowledgeBases enabled
  # and these missing it does not degrade, it crashloops on a 403 at startup.
  # That is the fourth time in this feature that a hand-copied chart Role has
  # lagged the kinds a process watches.
  #
  # Only here when the KB namespace is the tool namespace; a distinct KB
  # namespace gets its own Role/RoleBinding below instead.
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["connections", "corpora", "knowledgebases"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if and .Values.mcp.enabled (eq $kbNs $toolNs) }}
  # MCPTools (docs/adr/0045). The broker materializes these in the KB namespace
  # and the orchestrator WATCHES them to union MCP tools into its catalog — with
  # mcp enabled and this missing it crashloops on a 403 at startup, not degrades.
  # Only here when the KB namespace is the tool namespace; a distinct KB
  # namespace gets its own Role/RoleBinding below instead.
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["mcptools"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["toolruns"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["agentruns"]
    verbs: ["create", "get", "list", "watch", "delete"]
  {{- if .Values.localTool.enabled }}
  # LocalTools (ADR 0014): read the catalog, and read Secrets to resolve a
  # LocalTool's secretEnv before passing the values to the executor sidecar
  # (the sidecars have no k8s identity of their own). This `secrets: get` grant
  # widens the orchestrator's blast radius -- only added when LocalTools are on.
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["localtools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.identityLink.enabled }}
  # Per-run Secret injection for identity-linked Agents (docs/adr/0022): the
  # orchestrator resolves the calling user's linked GitHub token via
  # integration-gateway's /identity-link/* API and creates/patches a
  # per-run Secret that the launched AgentRun's Job consumes as its
  # GITHUB_TOKEN (AgentRunSpec.SecretEnv), instead of that Agent always
  # using a shared bot/PAT credential. This `secrets: create/patch` grant
  # widens the orchestrator's blast radius -- only added when identity
  # linking is on.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-orchestrator.fullname" . }}
  namespace: {{ include "agent-orchestrator.toolNamespace" . }}
  labels:
    {{- include "agent-orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-orchestrator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-orchestrator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and (or .Values.knowledgeBases.enabled .Values.mcp.enabled) (ne $kbNs $toolNs) }}
---
{{/*
When knowledge bases / MCP tools live in a namespace of their own
(knowledgeBases.namespace or global.knowledgeBaseNamespace), the CR read grant
has to be a Role THERE, not in the tool namespace — the orchestrator watches
KnowledgeBase/Corpus and MCPTool CRs in that namespace and 403-crashloops
without it. Still a namespaced Role (never a ClusterRole); the subject SA stays
in the release namespace. That namespace must already exist.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-orchestrator.fullname" . }}-kb
  namespace: {{ $kbNs }}
  labels:
    {{- include "agent-orchestrator.labels" . | nindent 4 }}
rules:
  {{- if .Values.knowledgeBases.enabled }}
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["connections", "corpora", "knowledgebases"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.mcp.enabled }}
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["mcptools"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-orchestrator.fullname" . }}-kb
  namespace: {{ $kbNs }}
  labels:
    {{- include "agent-orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-orchestrator.fullname" . }}-kb
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-orchestrator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
