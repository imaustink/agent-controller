name: CI

# Build, test, and static checks for every pull request into main.
#
# Split into one job per toolchain so a failure points straight at the thing
# that broke (Node build vs. a Go module vs. the controller) instead of one
# opaque red X, and so the jobs run in parallel. All jobs run on
# GitHub-hosted `ubuntu-latest` runners -- never the self-hosted
# `arc-runner-set-agent-controller` used by release.yml -- because a PR (fork
# PRs included) is untrusted content that must not reach the internal
# cluster/registry. See release.yml and validate-crds.yml for the same split.

on:
  pull_request:
    branches: [main]
    # Skip pure-docs PRs: `paths-ignore` only skips a run when EVERY changed
    # file matches, so a PR that touches both Markdown and code still runs.
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

# One in-flight run per PR branch; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Import boundaries (framework / catalog / orchestrator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # ADR 0047 splits the repo into a framework that depends on nothing, a
      # catalog and an orchestrator that may each depend only on the
      # framework. Being in one repo makes it trivially easy to reach across
      # that line, and nothing else would notice until someone tried to adopt
      # one half without the other. No `npm ci`: the checker is
      # dependency-free and reads source, package.json, go.mod and
      # Dockerfiles directly.
      #
      # Its own suite runs first, because the suite is what proves each rule
      # can actually fail. A boundary check that passes because it stopped
      # looking would otherwise look exactly like a clean repo.
      - name: Checker self-test
        run: npm run test:scripts

      - name: Check boundaries
        run: npm run check:boundaries

  protocol:
    name: Protocol (buf lint, breaking, codegen drift, Go conformance)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework/protocol
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Go is needed twice over: protoc-gen-go runs via `go run` during
      # generation, and the generated Go module has its own conformance test.
      - uses: actions/setup-go@v6
        with:
          go-version-file: framework/protocol/go/go.mod
          cache-dependency-path: framework/protocol/go/go.sum

      - run: npm ci
        working-directory: .

      - name: buf lint
        run: npx buf lint

      # The .proto files are a published contract (ADR 0047): other languages
      # and other people's orchestrators build against them, so a change that
      # breaks the JSON wire must fail here rather than in someone else's
      # deployment. Compared with WIRE_JSON rules (buf.yaml) against the PR's
      # base branch; skipped only while the base branch has no contract yet.
      - name: buf breaking (vs base branch)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF:$BASE_REF"
          if git cat-file -e "$BASE_REF:framework/protocol/buf.yaml" 2>/dev/null; then
            npx buf breaking --against "../../.git#branch=$BASE_REF,subdir=framework/protocol"
          else
            echo "::notice::$BASE_REF has no framework/protocol yet; nothing to compare against."
          fi

      # Generated code is committed (ADR 0047), so a .proto edit without a
      # regeneration -- or a hand edit to generated output -- would ship a
      # contract the bindings don't implement. Regenerate and require no diff,
      # untracked files included.
      - name: Generated code is up to date
        run: |
          npm run generate
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "::error::Generated code is stale. Run 'npm run generate -w @controller-agent/protocol' and commit the result."
            git status --porcelain -- .
            git diff -- . | head -100
            exit 1
          fi

      # The TypeScript and zod legs of the conformance suite run in the `node`
      # job with every other workspace's tests; this is the Go leg.
      - name: Go (gofmt, vet, conformance)
        working-directory: framework/protocol/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean; run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./...

  node:
    name: Node (build, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Newest Node the images build on (apps/*/Dockerfile use node:22);
          # engines require >=20, so this stays within every workspace's range.
          node-version: "22"
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is the source of truth and
      # a drifted package-lock.json fails the build instead of being silently
      # rewritten. Installs devDependencies (tsc/vitest/@types/*) -- the build
      # and tests need them -- so NODE_ENV must not be `production` here.
      - run: npm ci

      # Workspace fan-out scripts (see root package.json): each runs the
      # matching script in every workspace that defines it.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  go:
    name: Go ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two standalone Go modules with no external dependencies (no
        # go.sum). The controller is a heavier kubebuilder project handled in
        # its own job below.
        module:
          - orchestrator/sidecars/localtool-executor
          - catalog/tools-local/http-get-go
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # `go-version-file` is resolved from the repo root, not
          # working-directory, so it needs the full path.
          go-version-file: ${{ matrix.module }}/go.mod
          # These modules have no dependencies to cache, and setup-go's default
          # cache errors when it can't find a go.sum -- so turn it off.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean; run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  temporal-engine:
    name: Go temporal-engine (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/engines/temporal
    steps:
      - uses: actions/checkout@v5

      # Its own job rather than a row in the `go` matrix above: that matrix is
      # for modules with no external dependencies and deliberately disables
      # setup-go's cache, while this module has a go.sum worth caching.
      - uses: actions/setup-go@v6
        with:
          go-version-file: orchestrator/engines/temporal/go.mod
          cache-dependency-path: orchestrator/engines/temporal/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean; run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  temporal-engine-chart:
    name: Helm temporal-engine (lint, render)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/charts/agent-controller/charts/temporal-engine
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      # Rendered standalone rather than through the umbrella chart: the parent
      # pulls open-webui and nats from remote repos, so templating it needs a
      # `helm dependency build` and a network round trip to validate a subchart
      # that has neither.
      - name: Lint
        run: helm lint . --set qdrant.host=q --set nats.url=nats://n:4222

      # Both shapes matter. Defaults must render the minimum (no catalog-sync
      # without Qdrant, no AgentRun grant without the NATS bridge), and
      # everything-on must render at all -- an optional block that only breaks
      # when enabled is the one nobody notices.
      - name: Render with defaults
        run: helm template t . | python3 -c "import sys,yaml; list(yaml.safe_load_all(sys.stdin))"

      - name: Render with every option enabled
        run: |
          helm template t . \
            --set qdrant.host=qdrant \
            --set nats.url=nats://nats:4222 \
            --set gateway.senderAssertion.secretName=sa \
            --set identityLink.gatewayUrl=http://integration-gateway:8080 \
            --set identityLink.tokenSecretName=ig-token \
            | python3 -c "import sys,yaml; list(yaml.safe_load_all(sys.stdin))"

  rbac-parity:
    name: RBAC parity (markers -> role.yaml -> chart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # The spec renders the chart, so this job needs Helm as well as Node --
      # which is why it is not a step inside the `node` job above.
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - run: npm ci

      # The one e2e spec that needs no cluster and no credentials. It exists
      # because core-controller's permissions are written as +kubebuilder:rbac
      # markers and then copied twice (make manifests, then the Helm chart by
      # hand), only the chart's copy is installed, and a copy that is skipped
      # crashloops the controller while the caller sees nothing but a silent
      # agent run. See e2e/README.md.
      - name: e2e/specs/rbac-parity.e2e.ts
        run: npm run e2e -w e2e -- specs/rbac-parity.e2e.ts

      # The other spec that needs neither. The broker's routes and the four
      # clients that call them live in three packages and two languages, and
      # nothing but agreement makes them work — agreement that has broken
      # twice, silently, in releases that looked complete. Both times the unit
      # tests asserted the URL each client BUILT, so a rename moved the server
      # and left the client behind with nothing going red. This drives the
      # real clients against the real server; see the spec's header.
      - name: e2e/specs/broker-contract.e2e.ts
        run: npm run e2e -w e2e -- specs/broker-contract.e2e.ts

      # The third. Every cluster spec that indexes a corpus rests on the fake
      # Confluence answering what the real driver asks; if it has drifted,
      # those specs pass against a fiction. This drives the production driver
      # against the manifest's own server, so drift fails here in seconds
      # rather than turning a cluster suite green over nothing.
      - name: e2e/specs/fake-confluence-fidelity.e2e.ts
        run: npm run e2e -w e2e -- specs/fake-confluence-fidelity.e2e.ts

      # The fourth, and the cheapest. YAML discards a duplicate mapping key
      # silently, so appending a block to a values file that already has that
      # key deletes everything under the first one — which shipped here, and
      # surfaced three layers away as an orchestrator claiming a variable was
      # unset that was plainly set.
      - name: e2e/specs/values-duplicate-keys.e2e.ts
        run: npm run e2e -w e2e -- specs/values-duplicate-keys.e2e.ts

      # The fifth. Same contract as the Confluence fidelity spec, and the only
      # place auto-join (the one WRITE a driver performs) and a SECOND identity
      # are exercised at all.
      - name: e2e/specs/fake-slack-fidelity.e2e.ts
        run: npm run e2e -w e2e -- specs/fake-slack-fidelity.e2e.ts

      # The sixth. Pins every Drive behaviour that was found broken against a
      # real Drive — recursion, shortcuts and their target's version, PDF
      # extraction — each of which failed by quietly holding LESS than the
      # corpus claimed.
      - name: e2e/specs/fake-gdrive-fidelity.e2e.ts
        run: npm run e2e -w e2e -- specs/fake-gdrive-fidelity.e2e.ts

  core-controller:
    name: Go core-controller (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/controllers/core-controller
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: orchestrator/controllers/core-controller/go.mod
          cache-dependency-path: orchestrator/controllers/core-controller/go.sum

      # Reuse the project's own Makefile targets so CI runs exactly what a
      # developer runs locally, rather than a second, drifting definition of
      # "the checks". Each target self-installs its pinned tool into ./bin
      # (golangci-lint, controller-gen, setup-envtest) on first use.
      #
      # `make lint`  -> golangci-lint (static analysis + gofmt/goimports formatters).
      # `make test`  -> manifests + generate + go fmt + go vet, then the
      #                 envtest-backed `go test` suite (downloads the kube API
      #                 server test binaries via setup-envtest).
      # `make build` -> compiles the manager binary.
      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build
