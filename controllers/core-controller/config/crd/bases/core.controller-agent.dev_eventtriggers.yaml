---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: eventtriggers.core.controller-agent.dev
spec:
  group: core.controller-agent.dev
  names:
    kind: EventTrigger
    listKind: EventTriggerList
    plural: eventtriggers
    singular: eventtrigger
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceRef
      name: Source
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EventTrigger maps events matching a CEL predicate to an orchestrator turn,
          Skill, Agent or Tool with CEL-derived params (docs/adr/0048).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of EventTrigger
            properties:
              match:
                description: match selects events.
                properties:
                  cel:
                    description: cel must evaluate to bool. Absent matches every event
                      from sourceRef.
                    type: string
                type: object
              params:
                additionalProperties:
                  type: string
                description: params maps a name to a CEL expression evaluated against
                  the envelope.
                type: object
              priority:
                description: priority breaks ties when several triggers match; higher
                  wins, then name.
                format: int32
                type: integer
              reply:
                description: reply declares side effects around the run.
                properties:
                  github:
                    description: |-
                      GitHubReply posts to an issue or pull request. Every string is a
                      {{param}} template.
                    properties:
                      ack:
                        description: ack is a comment posted before the run starts.
                        type: string
                      issueNumber:
                        description: issueNumber is the issue or pull request number.
                        minLength: 1
                        type: string
                      removeLabel:
                        description: removeLabel is removed when the run ends, on
                          every outcome.
                        type: string
                      repository:
                        description: repository is "owner/name".
                        minLength: 1
                        type: string
                      result:
                        description: result posts the turn's result as a comment.
                        type: boolean
                      sessionPage:
                        description: sessionPage appends a session-page link to the
                          ack comment.
                        type: boolean
                    required:
                    - issueNumber
                    - repository
                    type: object
                  http:
                    description: HTTPReply POSTs the terminal outcome to a fixed URL.
                    properties:
                      secretRef:
                        description: 'secretRef signs the body (x-event-signature:
                          sha256=<hex hmac>).'
                        properties:
                          key:
                            description: key within the Secret's data.
                            type: string
                          name:
                            description: name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      url:
                        description: |-
                          url is a literal, never templated: a reply target must come from
                          operator config, not from event content (SSRF).
                        pattern: ^https?://
                        type: string
                    required:
                    - url
                    type: object
                type: object
              sessionKey:
                description: sessionKey is a {{param}} template for the turn's session
                  id.
                type: string
              sourceRef:
                description: sourceRef restricts the trigger to one EventSource.
                type: string
              target:
                description: target is what the event dispatches.
                properties:
                  agentRef:
                    description: agentRef dispatches an Agent CR (same namespace)
                      as a subagent.
                    type: string
                  orchestrator:
                    description: orchestrator runs a conversational turn on the rendered
                      prompt.
                    type: object
                  promptTemplate:
                    description: promptTemplate is the request, with {{param}} placeholders.
                    type: string
                  readOnly:
                    description: |-
                      readOnly makes every AgentRun/ToolRun this turn launches read-only and
                      suppresses write credentials. It can only restrict.
                    type: boolean
                  skillRef:
                    description: skillRef forces a Skill CR (same namespace).
                    type: string
                  toolRef:
                    description: |-
                      toolRef runs a Tool CR (same namespace) once, with params as its
                      arguments, skipping the planner.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of orchestrator, skillRef, agentRef or toolRef
                    must be set
                  rule: (has(self.orchestrator)?1:0)+(has(self.skillRef)?1:0)+(has(self.agentRef)?1:0)+(has(self.toolRef)?1:0)==1
                - message: promptTemplate is required unless toolRef is set
                  rule: has(self.toolRef) || (has(self.promptTemplate) && size(self.promptTemplate)
                    > 0)
            required:
            - target
            type: object
          status:
            description: status defines the observed state of EventTrigger
            properties:
              conditions:
                description: conditions; "Ready" reports that the CEL compiles and
                  refs resolve.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
