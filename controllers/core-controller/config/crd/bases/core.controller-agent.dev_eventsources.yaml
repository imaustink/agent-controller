---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: eventsources.core.controller-agent.dev
spec:
  group: core.controller-agent.dev
  names:
    kind: EventSource
    listKind: EventSourceList
    plural: eventsources
    singular: eventsource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cron.schedule
      name: Schedule
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EventSource declares how events arrive and how far they are trusted
          (docs/adr/0048): an authenticated webhook or a cron schedule. Every source
          produces the same normalized envelope for EventTriggers to match.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of EventSource
            properties:
              cron:
                description: cron makes this a timer source.
                properties:
                  payload:
                    description: |-
                      payload is an arbitrary JSON object delivered as envelope.body on every
                      tick, so triggers extract params from a cron event exactly as they would
                      from a webhook.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  schedule:
                    description: schedule in standard 5-field cron syntax.
                    minLength: 1
                    type: string
                  suspend:
                    description: suspend pauses ticking without deleting the source.
                    type: boolean
                  timeZone:
                    description: |-
                      timeZone is an IANA zone name for the schedule; absent means the
                      kube-controller-manager's zone (usually UTC).
                    type: string
                required:
                - schedule
                type: object
              sender:
                description: sender identifies who caused a webhook event.
                properties:
                  dropBots:
                    default: true
                    description: dropBots drops bot-authored events so an agent cannot
                      trigger itself.
                    type: boolean
                  isBotFrom:
                    description: isBotFrom is a CEL expression yielding whether the
                      sender is a bot.
                    type: string
                  loginFrom:
                    description: loginFrom is a CEL expression over the envelope yielding
                      the login.
                    minLength: 1
                    type: string
                  provider:
                    description: provider verifies the extracted login (GitHub team/collaborator
                      roles).
                    enum:
                    - github
                    type: string
                  repositoryFrom:
                    description: |-
                      repositoryFrom is a CEL expression yielding "owner/name": the
                      repository the sender's permission is checked on and the turn's target
                      repository (ADR 0042).
                    type: string
                required:
                - loginFrom
                - provider
                type: object
              webhook:
                description: webhook makes this an HTTP source.
                properties:
                  deliveryIdHeader:
                    description: |-
                      deliveryIdHeader names the header carrying the sender's delivery id
                      (envelope.id). Absent, the gateway generates one.
                    type: string
                  verify:
                    description: verify authenticates every delivery before it is
                      parsed.
                    properties:
                      header:
                        description: |-
                          header carries the signature (hmacSha256) or token (bearer; default
                          "authorization", which expects "Bearer <secret>"). Ignored for slackV0.
                        type: string
                      prefix:
                        description: |-
                          prefix is stripped from the hmacSha256 signature header before the hex
                          comparison (e.g. "sha256=" for GitHub).
                        type: string
                      scheme:
                        description: scheme selects the verification algorithm.
                        enum:
                        - hmacSha256
                        - slackV0
                        - bearer
                        type: string
                      secretRef:
                        description: secretRef names the shared secret (same namespace).
                        properties:
                          key:
                            description: key within the Secret's data.
                            type: string
                          name:
                            description: name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - scheme
                    - secretRef
                    type: object
                    x-kubernetes-validations:
                    - message: hmacSha256 requires header
                      rule: self.scheme != 'hmacSha256' || (has(self.header) && size(self.header)
                        > 0)
                required:
                - verify
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of webhook or cron must be set
              rule: (has(self.webhook)?1:0)+(has(self.cron)?1:0)==1
            - message: sender is only valid for webhook sources
              rule: '!has(self.sender) || has(self.webhook)'
          status:
            description: status defines the observed state of EventSource
            properties:
              conditions:
                description: conditions; "Ready" reports whether the source can deliver
                  events.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cronJobName:
                description: cronJobName is the CronJob materialized for a cron source.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
