---
# Source: app-interface/templates/interface.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-interface
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/managed-by: Helm
data:
  repo: "bitovi/checkout"
  deployBranch: "main"
  env: "prod"
  interface.yaml: |
    capabilities:
    - grant: bedrock
      serviceAccount: checkout
    dependencies:
      cache:
        memory: 512Mi
        storage: 1Gi
        type: redis
      db:
        backup: true
        database: checkout
        databases:
        - checkout
        - checkout_audit
        instances: 2
        owner: checkout_app
        storage: 20Gi
        type: postgres
      events:
        topics:
        - orders
        - refunds
        type: kafka
    deployBranch: main
    env: prod
    infra:
      ciSecrets: true
      deletionProtection: true
      hostedZone: example-com
      importIds:
        account: "012345678901"
        vpc: vpc-0abc123
    repo: bitovi/checkout
    secrets:
      stripe-key: op://platform/stripe/key
    workloads:
      marketing:
        aliases:
        - example.com
        - old.example.com
        domain: www.example.com
        kind: static-site
        spa: true
      nightly:
        env:
          JOB: reconcile
        image:
          repository: ghcr.io/bitovi/checkout
          tag: "2024-01-15"
        kind: cron
        resources:
          cpu: 250m
          memory: 256Mi
        schedule: 0 3 * * *
      web:
        advanced:
          terminationGracePeriodSeconds: 45
        capabilities:
        - storage
        - bedrock
        domain: checkout.example.com
        env:
          FEATURE_FLAG: "off"
          LOG_LEVEL: debug
          MAX_CONN: "25"
        health: /healthz
        image:
          pullPolicy: Always
          repository: ghcr.io/bitovi/checkout
          tag: "2024-01-15"
        kind: server
        migrate:
          command:
          - npm
          - run
          - migrate
        nameOverride: true
        port: 8080
        replicas: 2
        resources:
          cpu: 500m
          memory: 512Mi
        secrets: op://platform/checkout/env
        uses:
        - db
        - cache: REDIS_URL
  workloadNames: "marketing,nightly,web"
  dependencyNames: "cache,db,events"
