apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-temporal-worker
  labels:
    app.kubernetes.io/name: temporal-worker
    app.kubernetes.io/instance: rel
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-worker
      app.kubernetes.io/instance: rel
  template:
    metadata:
      # Annotation values must be strings. If yaml.ts ever stops quoting "true"
