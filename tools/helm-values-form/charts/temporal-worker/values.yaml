# Every value here must match the `default` for the same path in
# values.schema.json. That is not a style rule: prune.ts decides what to emit by
# comparing against the schema defaults, so a default that disagrees with this
# file makes the form either omit a real override or emit a redundant one.
# scripts/helm-check.mjs asserts the two agree.
replicaCount: 1

image:
  repository: ghcr.io/example/temporal-worker
  tag: "0.1.0"
  pullPolicy: IfNotPresent

temporal:
  hostPort: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: default
  taskQueue: worker-tq
  maxConcurrentActivities: 100
  tls:
    enabled: false
    secretName: null

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

podAnnotations: {}
nodeSelector: {}
extraArgs: []
extraEnv: []

serviceAccount:
  create: true
  name: null
