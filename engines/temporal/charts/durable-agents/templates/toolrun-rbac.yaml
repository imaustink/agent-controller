{{- if .Values.toolrun.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "durable-agents.labels" . | nindent 4 }}
---
# The worker creates ToolRun CRs and reads their mirrored status — never
# Jobs directly (the core-controller owns batch/jobs).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-toolrun-writer
  namespace: {{ .Values.catalog.namespace }}
  labels:
    {{- include "durable-agents.labels" . | nindent 4 }}
rules:
  - apiGroups: ["core.controller-agent.dev"]
    resources: ["toolruns"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-toolrun-writer
  namespace: {{ .Values.catalog.namespace }}
  labels:
    {{- include "durable-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-toolrun-writer
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-worker
    namespace: {{ .Release.Namespace }}
---
# Cluster-internal service for the callback listener; tool Jobs post here.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway-callback
  labels:
    {{- include "durable-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: callback
      port: 8081
      targetPort: callback
{{- end }}
