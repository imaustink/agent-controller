temporal:
  # Matches the temporalio/temporal chart's frontend service.
  address: temporal-frontend.temporal.svc:7233
  namespace: default

taskQueue: durable-agents

llm:
  baseURL: https://api.openai.com/v1
  model: gpt-4o-2024-08-06
  embedModel: text-embedding-3-small
  # Secret must contain an OPENAI_API_KEY key. Create it out of band:
  #   kubectl -n <ns> create secret generic durable-agents-secrets \
  #     --from-literal=OPENAI_API_KEY=<key>
  secretName: durable-agents-secrets

# Qdrant backs the catalog RAG index. Leave host empty to disable retrieval
# (plain-conversation mode). Point at your own instance or the qdrant chart.
qdrant:
  host: ""
  port: 6334
  # Namespaces the collections (prefix+tools/skills/agents). REQUIRED when
  # sharing a Qdrant instance with another indexer (e.g. the upstream
  # agent-orchestrator) — payload schemas differ, never share collections.
  collectionPrefix: ""

# Where agent-controller's Tool/Skill/Agent CRs live (also where ToolRun CRs
# are created, so tool Jobs run next to their Tool definitions).
catalog:
  namespace: controller-agent

# Tool execution (milestone 3): the worker creates ToolRun CRs; tool Jobs
# post HMAC-signed events to the gateway's callback listener, which signals
# the waiting workflow.
toolrun:
  enabled: true

callback:
  # Secret holding the HMAC key under key AGENT_CALLBACK_SECRET. Two copies
  # of the same value are needed — one in the release namespace (gateway
  # verifies) and one in catalog.namespace (the controller injects it into
  # tool Jobs, which sign):
  #   SECRET=$(openssl rand -hex 32)
  #   kubectl -n <release-ns> create secret generic durable-agents-callback \
  #     --from-literal=AGENT_CALLBACK_SECRET="$SECRET"
  #   kubectl -n <catalog-ns> create secret generic durable-agents-callback \
  #     --from-literal=AGENT_CALLBACK_SECRET="$SECRET"
  secretName: durable-agents-callback
  secretKey: AGENT_CALLBACK_SECRET
  # Callback URL base as reachable from tool Job pods. Empty derives
  # http://<release>-gateway-callback.<release-ns>.svc:8081
  baseURL: ""

# Optional 1Password-operator syncs (platforms running onepassword-connect):
# each entry becomes a OnePasswordItem CR materializing a k8s Secret named
# `name` from the vault item at `itemPath` (item field names become keys).
onePasswordItems: []
#  - name: durable-agents-callback
#    itemPath: vaults/bitovi-platform/items/durable-agents-callback

catalogSync:
  enabled: true
  image:
    repository: durable-agents-catalog-sync
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      memory: 192Mi

worker:
  replicas: 1
  image:
    repository: durable-agents-worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

gateway:
  replicas: 1
  image:
    repository: durable-agents-gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  # Dev-grade identity (see internal/rbac): a bearer-token map plus an
  # optional fallback for tokenless callers. Leave all empty to fail closed
  # to zero capabilities.
  identity:
    # JSON: {"<token>": {"subject": "user:x", "roles": ["reader"]}}
    staticIdentities: ""
    defaultSubject: ""
    defaultRoles: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
