apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temporal-worker.fullname" . }}
  labels:
    {{- include "temporal-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "temporal-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      # Annotation values must be strings. If yaml.ts ever stops quoting "true"
      # or "yes", they arrive here as booleans and the chart's own schema
      # (additionalProperties: {type: string}) rejects the values file outright
      # -- which is the point of routing them through a real template.
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "temporal-worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "temporal-worker.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.hostPort | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            - name: TEMPORAL_MAX_CONCURRENT_ACTIVITIES
              value: {{ .Values.temporal.maxConcurrentActivities | quote }}
            {{- if .Values.temporal.tls.enabled }}
            - name: TEMPORAL_TLS_SECRET
              value: {{ required "temporal.tls.secretName is required when temporal.tls.enabled is true" .Values.temporal.tls.secretName | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
